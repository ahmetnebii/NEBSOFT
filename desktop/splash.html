<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>NEBSOFT</title>
<style>
  html, body { margin: 0; height: 100%; background: #09090b; color: #f4f4f6; font-family: 'Segoe UI', Inter, Arial, sans-serif; overflow: hidden; -webkit-app-region: drag; }
  body { display: grid; place-items: center; }
  .bg { position: fixed; inset: -30%; background: radial-gradient(38% 34% at 30% 30%, rgba(99, 102, 241, .55), transparent 70%), radial-gradient(32% 30% at 72% 70%, rgba(6, 182, 212, .4), transparent 70%); filter: blur(40px); animation: d 6s ease-in-out infinite alternate; }
  .in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  svg { width: 78px; height: 78px; overflow: visible; }
  path { fill: none; stroke: #818cf8; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw .9s cubic-bezier(.2, .8, .2, 1) forwards; }
  path + path { stroke: #22d3ee; animation-delay: .18s; }
  .w { letter-spacing: .16em; font-size: 16px; font-weight: 600; opacity: 0; animation: up .5s .45s forwards; } .w i { font-style: normal; color: #818cf8; }
  .s { font-size: 12px; color: #9ca3af; opacity: 0; animation: up .5s .6s forwards; }
  .bar { width: 150px; height: 3px; border-radius: 3px; background: #27272a; overflow: hidden; } .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #6366f1, #06b6d4); animation: l 1.1s ease-in-out infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } } @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes l { from { transform: translateX(-100%); } to { transform: translateX(260%); } } @keyframes d { to { transform: translate(4%, -3%) scale(1.08); } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="in"><svg viewBox="0 0 76 76" aria-hidden="true"><path d="M16 62 V14 L60 62"/><path d="M60 62 V14"/></svg><div class="w">NEB<i>SOFT</i></div><div class="s">İşletme programlarınız hazırlanıyor…</div><div class="bar"><i></i></div></div>
</body>
</html>
