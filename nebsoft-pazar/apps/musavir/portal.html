<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mükellef Portalı</title>
<link rel="stylesheet" href="../../core/core.css">
<link rel="stylesheet" href="../../core/track.css">
<style>
  :root { --app-accent: #1d4ed8; --app-accent-soft: #dbeafe; --app-accent-soft-dark: #172554; }
  .tabs2 { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; }
  .tabs2 button { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 99px; padding: 8px 14px; font: 600 13px var(--font); cursor: pointer; }
  .tabs2 button[aria-selected="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
  .ln { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ln:last-child { border-bottom: 0; }
  .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat3 div { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 12px 14px; }
  .stat3 b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat3 span { font-size: 12px; color: var(--text-3); }
  .up { border: 2px dashed var(--border); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; display: block; }
  @media (max-width: 600px) { .stat3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="tk-bar"><div class="in" id="bar"></div></header>
<main class="tk-wrap" id="root" style="max-width:820px"></main>
<script src="../../core/core.js"></script>
<script src="data.js"></script>
<script>
(function () {
  const { esc, $, $$, icon, money, toast, sum, today } = NS;
  const M = window.MSV;
  const db = new NS.DB('musavir', M.seed);
  const S = () => db.settings({});
  const KEY = 'nebsoft:musavir:portal';
  const sget = () => { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } };
  const sset = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) { /* yok */ } };
  const perTxt = (p) => (p.length === 4 ? p + ' yılı' : `${NS.MONTHS[Number(p.slice(5)) - 1]} ${p.slice(0, 4)}`);
  let tab = 'vergi';
  $('#bar').innerHTML = `<div class="tk-mark">${icon('book')}</div><div class="grow"><b>${esc(S().bizName)}</b><span>Mükellef portalı</span></div><span id="out"></span>`;

  function login() {
    $('#out').innerHTML = '';
    $('#root').innerHTML = `<div class="tk-intro"><h1>Vergileriniz, evraklarınız ve müşavirinizle yazışmalarınız tek yerde</h1><p>VKN / TCKN ve müşavirinizin SMS ile gönderdiği giriş kodunu yazın.</p></div>
      <div class="tk-find" style="flex-wrap:wrap"><input class="input" id="vk" inputmode="numeric" placeholder="VKN / TCKN" aria-label="VKN"><input class="input" id="cd" placeholder="Giriş kodu" aria-label="Giriş kodu" style="max-width:180px;text-transform:uppercase"><button class="btn primary lg" id="go">Giriş</button></div>
      ${NS.pub ? '' : '<p class="small muted">Demo için <a href="#" id="hint">örnek mükellef bilgisini doldurun</a>.</p>'}
      <div class="tk-how"><div>${icon('calendar')}<b>Ödenecek vergiler</b>Verilen beyannamelerin tutarı ve son ödeme günü.</div><div>${icon('upload')}<b>Evrak gönderin</b>${NS.pub ? 'Fatura, ekstre ve Z raporlarının durumunu takip edin.' : 'Fatura, ekstre ve Z raporlarını telefondan yükleyin.'}</div><div>${icon('message')}<b>Müşavirinize yazın</b>Sorularınız kayıt altında, cevabı burada.</div></div>`;
    const go = () => { if (db.lookup({ vkn: $('#vk').value.trim(), code: $('#cd').value.trim().toUpperCase() }) === null) db.load(); const c = db.find('clients', (x) => x.vkn === $('#vk').value.trim() && M.code(x) === $('#cd').value.trim().toUpperCase()); if (!c) return toast('VKN veya giriş kodu hatalı', 'err'); sset(c.id); render(); };
    $('#go').onclick = go; $('#cd').onkeydown = (e) => { if (e.key === 'Enter') go(); };
    if ($('#hint')) $('#hint').onclick = (e) => { e.preventDefault(); const c = db.all('clients')[1]; $('#vk').value = c.vkn; $('#cd').value = M.code(c); };
  }
  function vergi(c) {
    const F = db.all('filings', (f) => f.client === c.id).sort((a, b) => b.due.localeCompare(a.due));
    const topay = F.filter((f) => f.status === 'verildi' && f.amount);
    const next = F.filter((f) => !['verildi', 'odendi'].includes(f.status)).sort((a, b) => a.due.localeCompare(b.due));
    return `<div class="stat3"><div><b style="color:${topay.length ? 'var(--err)' : 'inherit'}">${money(sum(topay, (f) => f.amount))}</b><span>Ödenecek vergi</span></div><div><b>${next.length}</b><span>Hazırlanan beyanname</span></div><div><b>${next[0] ? NS.date(next[0].due) : '—'}</b><span>En yakın son gün</span></div></div>
      ${topay.length ? `<section class="tk-panel"><h3>${icon('alert')} Ödemeniz gerekenler</h3><div class="b">${topay.map((f) => `<div class="ln"><span><b>${esc(M.T[f.type].name)}</b><div class="small muted">${perTxt(f.period)} · son ödeme ${NS.date(f.due)}</div></span><b>${money(f.amount)}</b></div>`).join('')}<p class="small muted mt">Ödemeyi GİB Hazır Ödeme / internet bankacılığından vergi numaranızla yapabilirsiniz.</p></div></section>` : ''}
      <section class="tk-panel"><h3>${icon('calendar')} Beyanname geçmişi</h3><div class="b">${F.slice(0, 14).map((f) => `<div class="ln"><span><b>${esc(M.T[f.type].name)}</b><div class="small muted">${perTxt(f.period)} · son gün ${NS.date(f.due)}</div></span><span class="right">${NS.badge(M.ST[f.status][0], M.ST[f.status][1])}${f.amount ? `<div class="small">${money(f.amount)}</div>` : ''}</span></div>`).join('')}</div></section>`;
  }
  function evrak(c) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); const m = NS.iso(d).slice(0, 7);
    const docs = db.data.docs[`${c.id}|${m}`] || {};
    return `<section class="tk-panel"><h3>${icon('file')} ${perTxt(m)} dönemi evrakları</h3><div class="b">${M.DOCS.map((k) => `<div class="ln"><span>${esc(k)}</span>${docs[k] === 'geldi' ? NS.badge('Teslim alındı', 'ok') : NS.badge(docs[k] === 'eksik' ? 'Eksik' : 'Bekleniyor', docs[k] === 'eksik' ? 'warn' : 'err')}</div>`).join('')}</div></section>
      <section class="tk-panel"><h3>${icon('upload')} ${NS.pub ? 'Evrak bildir' : 'Evrak yükle'}</h3><div class="b"><div class="field mb"><label for="dt">Belge türü</label><select class="input" id="dt">${M.DOCS.map((k) => `<option>${esc(k)}</option>`).join('')}</select></div>${NS.pub ? `<p class="small muted" style="margin-top:0">Belgeleri müşavirinize e-posta veya WhatsApp ile ilettikten sonra buradan bildirin; dönem listeniz güncellenir.</p><button class="btn primary block" id="dn">${icon('check')} İlettim olarak bildir</button>` : ''}<label class="up" ${NS.pub ? 'hidden' : ''}><input type="file" id="fl" multiple hidden accept="image/*,application/pdf,.xls,.xlsx,.xml,.zip">${icon('upload')}<div><b>Dosya seçin veya fotoğraf çekin</b></div><div class="small muted">PDF, Excel, XML, fotoğraf</div></label></div></section>`;
  }
  function ucret(c) {
    const fees = db.all('fees', (f) => f.client === c.id).sort((a, b) => b.period.localeCompare(a.period)); const pays = db.all('payments', (p) => p.client === c.id);
    const bal = sum(fees, (f) => f.amount) - sum(pays, (p) => p.amount);
    return `<div class="stat3"><div><b>${money(c.fee || 0)}</b><span>Aylık ücret</span></div><div><b style="color:${bal > 0 ? 'var(--err)' : 'inherit'}">${money(Math.max(0, bal))}</b><span>Bakiye</span></div><div><b>${pays.length ? NS.date(pays.sort((a, b) => b.at.localeCompare(a.at))[0].at) : '—'}</b><span>Son ödeme</span></div></div>
      ${bal > 0 ? `<div class="tk-call"><h3>${icon('building')} Havale bilgisi</h3><p>${esc(S().bizName)} · <span class="mono">${esc(S().iban || '')}</span><br>Açıklamaya VKN'nizi yazın.</p></div>` : ''}
      <section class="tk-panel"><h3>${icon('receipt')} Makbuzlar</h3><div class="b">${fees.map((f) => `<div class="ln"><span><b>${perTxt(f.period)}</b><div class="small muted">${esc(f.smm || '')}</div></span><b>${money(f.amount)}</b></div>`).join('')}</div></section>`;
  }
  function mesaj(c) {
    const ms = db.all('messages', (m) => m.client === c.id).sort((a, b) => b.at.localeCompare(a.at));
    return `<section class="tk-panel"><h3>${icon('message')} Müşavirinize yazın</h3><div class="b"><textarea class="input" id="mx" rows="4" placeholder="Sorunuz veya notunuz"></textarea><button class="btn primary mt" id="ms">${icon('send')} Gönder</button></div></section>
      <section class="tk-panel"><h3>${icon('list')} Yazışmalar</h3><div class="b">${ms.map((m) => `<div class="ln" style="grid-template-columns:1fr"><span><b>${m.from === 'mukellef' ? 'Siz' : esc(S().bizName)}</b> <span class="small muted">${NS.dt(m.at)}</span><div>${esc(m.text)}</div>${m.file ? `<div class="small">${icon('file')} ${esc(m.file)}</div>` : ''}</span></div>`).join('') || '<span class="small muted">Henüz yazışma yok</span>'}</div></section>`;
  }
  function render() {
    db.load(); const c = db.get('clients', sget()); if (!c) return login();
    $('#out').innerHTML = `<button class="btn ghost" id="lo">${icon('logout')} Çıkış</button>`; $('#lo').onclick = () => { sset(null); db.pubLogout(); login(); };
    const T = { vergi: ['Vergilerim', vergi], evrak: ['Evrak', evrak], ucret: ['Ücret', ucret], mesaj: ['Mesajlar', mesaj] };
    $('#root').innerHTML = `<div class="tk-head"><div class="top"><span class="tk-pill">${esc(M.TYPES[c.type])}</span></div><h2>${esc(c.name)}</h2><p class="muted">VKN ${esc(c.vkn)} · ${esc(c.taxOffice || '')} V.D.</p></div>
      <div class="tabs2" role="tablist">${Object.entries(T).map(([k, [l]]) => `<button role="tab" data-tab="${k}" aria-selected="${k === tab}">${l}</button>`).join('')}</div><div id="pane">${T[tab][1](c)}</div>`;
    $$('[data-tab]').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; render(); }; });
    if ($('#fl')) $('#fl').onchange = (e) => { const files = [...e.target.files]; if (!files.length) return; const k = $('#dt').value; const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); const m = NS.iso(d).slice(0, 7); db.data.docs[`${c.id}|${m}`] = { ...(db.data.docs[`${c.id}|${m}`] || {}), [k]: 'geldi' }; db.insert('messages', { client: c.id, at: new Date().toISOString(), from: 'mukellef', text: `${k} yüklendi (${files.length} dosya)`, file: files.map((f) => f.name).join(', ') }); toast('Evrakınız müşavirinize iletildi', 'ok'); render(); };
    if ($('#dn')) $('#dn').onclick = () => { const k = $('#dt').value; const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); const m = NS.iso(d).slice(0, 7); db.data.docs[`${c.id}|${m}`] = { ...(db.data.docs[`${c.id}|${m}`] || {}), [k]: 'geldi' }; db.insert('messages', { client: c.id, at: new Date().toISOString(), from: 'mukellef', text: `${k} iletildi (portal bildirimi)` }); toast('Bildiriminiz müşavirinize iletildi', 'ok'); render(); };
    if ($('#ms')) $('#ms').onclick = () => { const t = $('#mx').value.trim(); if (!t) return; db.insert('messages', { client: c.id, at: new Date().toISOString(), from: 'mukellef', text: t }); toast('Mesajınız iletildi', 'ok'); render(); };
  }
  render();
})();
</script>
</body>
</html>
