<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT Kurs & Etüt</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .tt { display: grid; grid-template-columns: 70px repeat(6, minmax(130px, 1fr)); gap: 6px; overflow-x: auto; }
  .tt .h { font-weight: 700; text-align: center; padding: 8px; background: var(--surface-2); border-radius: 8px; font-size: 12.5px; }
  .tt .tm { font-size: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; }
  .tt .ls { border-radius: 8px; padding: 6px 8px; color: #fff; font-size: 11.5px; min-height: 48px; cursor: pointer; }
  .tt .em { border: 1px dashed var(--border); border-radius: 8px; min-height: 48px; cursor: pointer; }
  .tt .em:hover { border-color: var(--accent); }
  .att { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .att button { border: 0; background: var(--surface); padding: 6px 12px; font: 600 12px var(--font); cursor: pointer; color: var(--text-2); }
  .att button.on.v { background: var(--ok); color: #fff; } .att button.on.y { background: var(--err); color: #fff; } .att button.on.g { background: var(--warn); color: #fff; } .att button.on.i { background: var(--info); color: #fff; }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/integrations.js"></script>
<script src="app.js"></script>
</body>
</html>
