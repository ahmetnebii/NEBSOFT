<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Müvekkil Portalı</title>
<link rel="stylesheet" href="../../core/core.css">
<link rel="stylesheet" href="../../core/track.css">
<style>
  :root { --app-accent: #334155; --app-accent-soft: #e2e8f0; --app-accent-soft-dark: #1e293b; }
  .ln { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ln:last-child { border-bottom: 0; }
  .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat3 div { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 12px 14px; }
  .stat3 b { display: block; font-size: 20px; }
  .stat3 span { font-size: 12px; color: var(--text-3); }
  @media (max-width: 600px) { .stat3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="tk-bar"><div class="in" id="bar"></div></header>
<main class="tk-wrap" id="root" style="max-width:820px"></main>
<script src="../../core/core.js"></script>
<script src="data.js"></script>
<script>
(function () {
  const { esc, $, icon, money, toast, sum, today } = NS;
  const H = window.HKK; const db = new NS.DB('hukuk', H.seed); const S = () => db.settings({});
  const KEY = 'nebsoft:hukuk:portal';
  const sget = () => { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } };
  const sset = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) { /* yok */ } };
  $('#bar').innerHTML = `<div class="tk-mark">${icon('shield')}</div><div class="grow"><b>${esc(S().bizName)}</b><span>Müvekkil portalı</span></div><span id="out"></span>`;
  function login() {
    $('#out').innerHTML = '';
    $('#root').innerHTML = `<div class="tk-intro"><h1>Dosyalarınızın durumu, duruşma tarihleri ve masraflarınız</h1><p>TCKN / VKN ve avukatınızın gönderdiği giriş kodu ile girin.</p></div><div class="tk-find" style="flex-wrap:wrap"><input class="input" id="id" inputmode="numeric" placeholder="TCKN / VKN" aria-label="TCKN veya VKN"><input class="input" id="cd" placeholder="Giriş kodu" aria-label="Giriş kodu" style="max-width:160px;text-transform:uppercase"><button class="btn primary lg" id="go">Giriş</button></div><p class="small muted">Demo için <a href="#" id="hint">örnek müvekkil bilgisini doldurun</a>.</p>
      <div class="tk-how"><div>${icon('calendar')}<b>Duruşmalar</b>Tarih, saat ve mahkeme bilgisi; sonuçlar.</div><div>${icon('wallet')}<b>Masraf ve avans</b>Yatırdığınız avans ve harcamaların dökümü.</div><div>${icon('message')}<b>Avukatınıza yazın</b>Sorularınız dosyanıza kaydedilir.</div></div>`;
    const go = () => { db.load(); const c = db.find('clients', (x) => x.idNo === $('#id').value.trim() && H.code(x) === $('#cd').value.trim().toUpperCase()); if (!c) return toast('Bilgiler hatalı', 'err'); sset(c.id); render(); };
    $('#go').onclick = go; $('#cd').onkeydown = (e) => { if (e.key === 'Enter') go(); };
    $('#hint').onclick = (e) => { e.preventDefault(); const c = db.all('clients')[1]; $('#id').value = c.idNo; $('#cd').value = H.code(c); };
  }
  function render() {
    db.load(); const c = db.get('clients', sget()); if (!c) return login();
    $('#out').innerHTML = `<button class="btn ghost" id="lo">${icon('logout')} Çıkış</button>`; $('#lo').onclick = () => { sset(null); login(); };
    const F = db.all('files', (f) => f.client === c.id); const ids = new Set(F.map((f) => f.id));
    const next = db.all('hearings', (h) => ids.has(h.file) && h.date >= today()).sort((a, b) => a.date.localeCompare(b.date));
    const past = db.all('hearings', (h) => ids.has(h.file) && h.result).sort((a, b) => b.date.localeCompare(a.date));
    const adv = sum(db.all('advances', (a) => a.client === c.id), (a) => a.amount); const exp = db.all('expenses', (e) => e.client === c.id);
    const bal = adv - sum(exp, (e) => e.amount); const fileOf = (id) => F.find((f) => f.id === id) || {};
    const msgs = db.all('messages', (m) => m.client === c.id).sort((a, b) => b.at.localeCompare(a.at));
    $('#root').innerHTML = `<div class="tk-head"><h2>${esc(c.name)}</h2><p class="muted">${F.length} dosya · avukatınız ${esc((F[0] || {}).lawyer || S().bizName)}</p></div>
      <div class="stat3"><div><b>${next[0] ? NS.date(next[0].date) : '—'}</b><span>Sonraki duruşma</span></div><div><b>${F.filter((f) => !['kapali', 'kesin'].includes(f.status)).length}</b><span>Açık dosya</span></div><div><b style="color:${bal < 0 ? 'var(--err)' : 'inherit'}">${money(bal)}</b><span>Avans bakiyesi</span></div></div>
      ${bal < 0 ? `<div class="tk-call"><h3>${icon('alert')} Masraf avansı gerekiyor</h3><p>Dosya masrafları yatırdığınız avansı ${money(-bal)} aştı. Havale: ${esc(S().iban || '')}</p></div>` : ''}
      <section class="tk-panel"><h3>${icon('calendar')} Yaklaşan duruşmalar</h3><div class="b">${next.map((h) => { const f = fileOf(h.file); return `<div class="ln"><span><b>${NS.dateLong(new Date(h.date + 'T12:00'))} · ${esc(h.time)}</b><div class="small muted">${esc(f.court)} · ${esc(f.esas)} · ${esc(h.kind)}</div></span><span class="small">${esc(f.subject)}</span></div>`; }).join('') || '<span class="small muted">Planlanmış duruşma yok</span>'}</div></section>
      <section class="tk-panel"><h3>${icon('file')} Dosyalarım</h3><div class="b">${F.map((f) => `<div class="ln"><span><b>${esc(f.subject)}</b><div class="small muted">${esc(H.TYPES[f.type])} · ${esc(f.court)} · ${esc(f.esas)} · karşı taraf ${esc(f.opponent || '-')}</div></span>${NS.badge(H.ST[f.status][0], H.ST[f.status][1])}</div>`).join('')}</div></section>
      ${past.length ? `<section class="tk-panel"><h3>${icon('list')} Son duruşma sonuçları</h3><div class="b">${past.slice(0, 5).map((h) => `<div class="ln" style="grid-template-columns:1fr"><span><b>${NS.date(h.date)}</b> · ${esc(fileOf(h.file).esas || '')}<div class="small">${esc(h.result)}</div></span></div>`).join('')}</div></section>` : ''}
      <section class="tk-panel"><h3>${icon('wallet')} Masraf dökümü</h3><div class="b"><div class="ln"><span>Yatırılan avans</span><b>${money(adv)}</b></div>${exp.map((e) => `<div class="ln"><span>${esc(e.type)}<div class="small muted">${NS.date(e.at)} · ${esc(fileOf(e.file).esas || '')}</div></span><span>−${money(e.amount)}</span></div>`).join('')}</div></section>
      <section class="tk-panel"><h3>${icon('message')} Avukatınıza yazın</h3><div class="b"><textarea class="input" id="mx" rows="3" placeholder="Sorunuz"></textarea><button class="btn primary mt" id="ms">${icon('send')} Gönder</button>${msgs.map((m) => `<div class="ln" style="grid-template-columns:1fr"><span><b>${m.from === 'muvekkil' ? 'Siz' : 'Büro'}</b> <span class="small muted">${NS.dt(m.at)}</span><div>${esc(m.text)}</div></span></div>`).join('')}</div></section>`;
    $('#ms').onclick = () => { const t = $('#mx').value.trim(); if (!t) return; db.insert('messages', { client: c.id, at: new Date().toISOString(), from: 'muvekkil', text: t }); toast('Mesajınız iletildi', 'ok'); render(); };
  }
  render();
})();
</script>
</body>
</html>
