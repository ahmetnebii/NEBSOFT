<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT Site Yönetimi</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .flat { border-radius: 10px; padding: 8px 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 12px; }
  .flat b { font-size: 14px; }
  .flat.debt { background: var(--err-soft); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
  .flat.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/integrations.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
