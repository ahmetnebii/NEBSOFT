<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NEBSOFT Yönetim</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../core/core.css">
<style>
  .wiz { max-width: 760px; margin: 40px auto; padding: 0 16px; }
  .steps { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .steps span { padding: 6px 14px; border-radius: 99px; background: var(--bg-2); font-size: 13px; font-weight: 600; color: var(--text-3); }
  .steps span.on { background: var(--accent); color: #fff; }
  pre.sql { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 12px; overflow: auto; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 14px; font-size: 14px; }
  .kv b { color: var(--text-2); font-weight: 600; }
</style>
