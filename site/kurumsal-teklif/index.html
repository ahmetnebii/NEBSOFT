.kt{max-width:760px}.kt h1{margin-bottom:10px}
.kt form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.kt label{display:flex;flex-direction:column;gap:6px;font:600 14px var(--txt);color:var(--ink);min-width:0}
.kt .tam{grid-column:1/-1}
.kt input,.kt select,.kt textarea{font:400 15px var(--txt);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;box-sizing:border-box}
.kt textarea{min-height:96px;resize:vertical}
.kt .sec{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;color:var(--ink2)}.kt .sec input{width:auto;margin-top:3px}
.kt .prg{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.kt .prg label{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--ink2)}.kt .prg input{width:auto}

<body>
<header class="hd mk"><div class="w">
  <a class="logo" href="/" aria-label="NEBSOFT ana sayfa"><img src="/assets/icons/icon-64.png" alt="" width="36" height="36"><span class="wm"><b>NEB</b><i>SOFT</i></span></a>
  <nav class="nav" aria-label="Ana menü"><a href="/programlar">Programlar</a><a href="/fiyatlar/">Fiyatlar</a><a href="/#/iletisim">İletişim</a></nav>
  <a class="btn g" href="/#/giris">Giriş yap</a>
</div></header>
<main id="ana">
<section class="s"><div class="w kt">
  <nav class="crumb" aria-label="Konum"><a href="/">NEBSOFT</a> / Kurumsal Teklif</nav>
  <h1>Kurumsal teklif isteyin</h1>
  <p class="lead">Meslek odası, dernek, bayi veya çok lisanslı alımlar için fiyat teklifle belirlenir. Formu doldurun, ekibimiz yazdığınız adresten size dönsün.</p>
  <form id="f" novalidate>
    <label class="tam">Kurum adı<input name="kurum" required maxlength="160" autocomplete="organization"></label>
    <label>Kurum türü<select name="tur" required><option value="">Seçin</option></select></label>
    <label>Yetkili adı soyadı<input name="yetkili" required maxlength="120" autocomplete="name"></label>
    <label>E-posta<input name="eposta" type="email" required maxlength="190" autocomplete="email"></label>
    <label>Telefon<input name="telefon" type="tel" required maxlength="20" autocomplete="tel" placeholder="05xx xxx xx xx"></label>
    <label>Lisans sayısı<input name="lisans" type="number" min="1" max="100000" value="1" required></label>
    <label>Şube sayısı<input name="sube" type="number" min="1" max="100000" value="1" required></label>
    <div class="tam"><label style="margin-bottom:6px">İlgilendiğiniz programlar</label><div class="prg" id="prg"></div></div>
    <label class="tam">Notunuz (isteğe bağlı)<textarea name="not" maxlength="2000" placeholder="İhtiyacınızı kısaca yazın. Sağlık, kimlik veya kart bilgisi yazmayın."></textarea></label>
    <label class="sec tam"><input type="checkbox" name="kvkk" required><span><a href="/kvkk/" target="_blank" rel="noopener">KVKK aydınlatma metnini</a> okudum. Bilgilerim bu teklif talebini yanıtlamak için işlenir.</span></label>
    <label class="sec tam"><input type="checkbox" name="ticariIzin"><span>Kampanya ve duyurular için bana ticari elektronik ileti gönderilmesine izin veriyorum (isteğe bağlı).</span></label>
    <p class="msg" id="msg" role="status"></p>
    <button class="btn p tam" type="submit" id="gonder">Teklif iste</button>
  </form>
</div></section>
</main>
<footer style="padding:28px 16px;text-align:center;font-size:13px;color:var(--ink3)">© NEBSOFT · <a href="/kvkk/">KVKK ve yasal metinler</a></footer>
<script src="/market/catalog.js"></script>
<script>
(function () {
  var f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('gonder'), q = new URLSearchParams(location.search);
  var yaz = function (t, c) { msg.textContent = t; msg.className = 'msg ' + (c || ''); };
  // Sepetten gelen bilgiler formu doldurur; hepsi kullanıcı tarafından değiştirilebilir
  var sayi = function (k) { var n = parseInt(q.get(k), 10); if (n >= 1 && n <= 100000) f.elements[k].value = n; };
  sayi('lisans'); sayi('sube');
  var secili = (q.get('program') || '').split(',');
  var P = ((window.CATALOG && window.CATALOG.products) || []).filter(function (p) { return p.ready && !p.hidden; });
  var kutu = document.getElementById('prg');
  P.forEach(function (p) { var l = document.createElement('label'); var i = document.createElement('input'); i.type = 'checkbox'; i.value = p.id; i.checked = secili.indexOf(p.id) >= 0; l.appendChild(i); l.appendChild(document.createTextNode(p.name)); kutu.appendChild(l); });
  fetch('/api/destek/paketler').then(function (r) { return r.json(); }).then(function (j) {
    var s = f.elements.tur; Object.keys(j.turler || {}).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = j.turler[k]; s.appendChild(o); }); if (j.turler && j.turler[q.get('tur')]) s.value = q.get('tur');
  }).catch(function () { yaz('Form bilgileri yüklenemedi. Lütfen sayfayı yenileyin.', 'err'); });
  f.addEventListener('submit', function (e) {
    e.preventDefault(); if (!f.reportValidity()) return; yaz(''); btn.disabled = true;
    var b = { kurum: f.elements.kurum.value, tur: f.elements.tur.value, yetkili: f.elements.yetkili.value, eposta: f.elements.eposta.value, telefon: f.elements.telefon.value, lisans: Number(f.elements.lisans.value), sube: Number(f.elements.sube.value), not: f.elements.not.value, kvkk: f.elements.kvkk.checked, ticariIzin: f.elements.ticariIzin.checked, program_listesi: Array.prototype.map.call(kutu.querySelectorAll('input:checked'), function (i) { return i.value; }) };
    fetch('/api/kurumsal-teklif', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-ns-csrf': '1' }, body: JSON.stringify(b) }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); }).then(function (x) {
      if (x.j && x.j.ok) { f.reset(); yaz('Talebiniz alındı. Talep numaranız: ' + x.j.no, 'ok'); } else yaz((x.j && x.j.error) || 'Talep gönderilemedi. Lütfen tekrar deneyin.', 'err');
    }).catch(function () { yaz('Bağlantı kurulamadı. Lütfen tekrar deneyin.', 'err'); }).then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
