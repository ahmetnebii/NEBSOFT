<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT Veteriner</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .pet-av { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; flex: none; }
  .pet-av.lg { width: 72px; height: 72px; font-size: 36px; border-radius: 20px; }
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
  .tl .it { position: relative; padding-bottom: 14px; }
  .tl .it::before { content: ''; position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--accent)); border: 2px solid var(--surface); }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/integrations.js"></script>
<script src="../../core/kvkk.js"></script>
<script src="app.js"></script>
</body>
</html>
