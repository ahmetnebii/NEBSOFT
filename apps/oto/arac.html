<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aracım Nerede?</title>
<link rel="stylesheet" href="../../core/core.css">
<link rel="stylesheet" href="../../core/track.css">
<style>
  :root { --app-accent: #0284c7; --app-accent-soft: #e0f2fe; --app-accent-soft-dark: #0c2a3a; }
  .plate { display: inline-flex; align-items: stretch; border: 2px solid #111; border-radius: 6px; background: #fff; color: #111; font: 800 22px ui-monospace, Menlo, monospace; letter-spacing: .06em; overflow: hidden; }
  .plate::before { content: 'TR'; background: #1d4ed8; color: #fff; font: 700 11px var(--font); display: grid; place-items: end center; padding: 4px 6px; }
  .plate span { padding: 4px 12px; }
  .big { font-size: 40px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .q { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .q i { width: 30px; height: 30px; border-radius: 8px; background: var(--bg-2); display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; color: var(--text-3); }
  .q i.me { background: var(--accent); color: #fff; }
  .q i.wash { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--accent); }
  .tk-find input { text-transform: uppercase; }
</style>
</head>
<body>
<header class="tk-bar"><div class="in" id="bar"></div></header>
<main class="tk-wrap" id="root" style="max-width:760px"></main>
<script src="../../core/core.js"></script>
<script>
(function () {
  const { esc, $, on, icon, money, toast, today } = NS;
  const db = new NS.DB('oto');
  const S = () => db.settings({ firstHour: 80, nextHour: 50, dailyMax: 400, graceMin: 10 });
  const norm = (p) => String(p || '').toLocaleUpperCase('tr-TR').replace(/\s+/g, '').replace(/^(\d{2})([A-ZÇĞİÖŞÜ]{1,3})(\d{2,4})$/, '$1 $2 $3');
  const pkg = (id) => db.get('packages', id) || { name: '-', min: 30 };
  const subOf = (plate) => db.find('subs', (x) => norm(x.plate) === norm(plate) && x.end >= today());
  // Gişe tarifesiyle aynı hesap (app.js fee)
  const fee = (p, at = new Date()) => {
    const s = S(); const min = Math.max(0, (at - new Date(p.in)) / 60000);
    const sub = subOf(p.plate); if (sub && sub.plan === 'otopark') return 0; if (min <= s.graceMin) return 0;
    const days = Math.floor(min / 1440), rest = min % 1440;
    const full = days * s.dailyMax + (rest <= 0 ? 0 : Math.min(s.dailyMax, s.firstHour + Math.max(0, Math.ceil(rest / 60) - 1) * s.nextHour));
    if (p.paidAt) return at - new Date(p.paidAt) <= 15 * 60000 ? 0 : Math.max(0, full - (p.paidAmount || 0));
    return full;
  };
  const durTxt = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)} sa ${m % 60} dk` : `${m} dk`; };
  const RK = 'nebsoft:oto:plaka';
  let timer = null;

  $('#bar').innerHTML = `<div class="tk-mark">${icon('car')}</div><div class="grow"><b>${esc(S().bizName || 'Oto Yıkama')}</b><span>Aracım nerede?</span></div><a class="btn ghost icon" href="tel:${esc(String(S().bizPhone || '').replace(/\s/g, ''))}" aria-label="Ara">${icon('phone')}</a><button class="btn ghost icon" id="th" data-theme-ico aria-label="Tema">${icon(NS.getTheme() === 'dark' ? 'sun' : 'moon')}</button>`;
  $('#th').onclick = NS.toggleTheme;

  // Plaka + fişteki takip kodu birlikte gerekir (yalnızca plakayla, plakayı bilen herkes aracın tesiste olup olmadığını görüyordu — KVKK)
  const finder = (v, c) => `<div class="tk-find"><input class="input" id="k" placeholder="Plaka (ör. 34 ABC 123)" value="${esc(v || '')}" aria-label="Plaka" autocomplete="off"><input class="input" id="kc" placeholder="Fişteki kod" value="${esc(c || '')}" aria-label="Fişteki takip kodu" autocomplete="off" style="max-width:130px;text-transform:uppercase"><button class="btn primary lg" id="go">${icon('search')} Sorgula</button></div><div class="tk-recent"></div>`;

  function render(plate, code) {
    clearInterval(timer);
    const pl = norm(plate); const kc = String(code || '').trim().toUpperCase();
    if (!pl || !kc || db.lookup({ plate: pl, code: kc }) === null) db.load();
    const mine = (r) => norm(r.plate) === pl && (NS.pub || (!!kc && r.code === kc));
    if (!pl) {
      let ex = '', exc = ''; const j = db.all('jobs', (x) => ['bekliyor', 'yikaniyor', 'hazir'].includes(x.status) && x.code)[0]; if (j) { ex = j.plate; exc = j.code; }
      $('#root').innerHTML = `<div class="tk-view"><div class="tk-intro"><h1>Aracın hazır mı?</h1><p>Plakanı ve fişteki kodu yaz; yıkamadaki sıranı ve tahmini hazır olma saatini gör, otopark ücretini anlık gör.</p></div>${finder('')}${ex && !NS.pub ? `<p class="small muted">Demo için örnek: <a href="#" data-ex="${esc(ex)}" data-exc="${esc(exc)}">${esc(ex)} · ${esc(exc)}</a></p>` : ''}
        <div class="tk-how"><div>${icon('drop')}<b>Yıkama sırası</b>Önünde kaç araç olduğunu ve tahmini süreyi gör.</div><div>${icon('card')}<b>Otopark ücreti</b>Şu an çıkarsan ödeyeceğin tutarı anlık gör.</div><div>${icon('award')}<b>Abonelik</b>Kalan yıkama hakkın ve bitiş tarihin.</div></div></div>`;
      return bind();
    }
    if (!kc) { $('#root').innerHTML = `<div class="tk-view">${finder(pl)}<div class="tk-panel"><div class="b empty">${icon('lock')}<div>Fişinizdeki <b>takip kodunu</b> yazın.</div></div></div></div>`; return bind(); }
    try { localStorage.setItem(RK, JSON.stringify({ pl, kc })); } catch (e) { /* yok */ }
    const jobs = db.all('jobs', (x) => mine(x) && x.status !== 'teslim').sort((a, b) => b.in.localeCompare(a.in));
    const job = jobs[0];
    const park = db.find('parks', (x) => mine(x) && !x.out);
    const sub0 = subOf(pl); const sub = sub0 && (NS.pub || (sub0.portalCode && sub0.portalCode === kc)) ? sub0 : null;
    if (!job && !park && !sub) { $('#root').innerHTML = `<div class="tk-view">${finder(pl, kc)}<div class="tk-panel"><div class="b empty">${icon('search')}<div>Plaka veya kod hatalı ya da araç şu an tesiste görünmüyor.</div></div></div></div>`; return bind(); }
    let wash = '';
    if (job) {
      const queue = db.all('jobs', (x) => ['bekliyor', 'yikaniyor'].includes(x.status)).sort((a, b) => a.in.localeCompare(b.in));
      const pos = queue.findIndex((x) => x.id === job.id);
      const ahead = queue.slice(0, Math.max(0, pos));
      const washing = queue.filter((x) => x.status === 'yikaniyor').length || 1;
      const waitMin = job.status === 'hazir' ? 0 : Math.round((ahead.reduce((t, x) => t + pkg(x.pkg).min, 0)) / Math.max(1, washing)) + (job.status === 'yikaniyor' ? Math.max(5, pkg(job.pkg).min - (Date.now() - new Date(job.started || job.in)) / 60000) : pkg(job.pkg).min);
      const eta = new Date(Date.now() + waitMin * 60000);
      const steps = [['bekliyor', 'Sırada', 'clock'], ['yikaniyor', 'Yıkanıyor', 'drop'], ['hazir', 'Hazır', 'check']];
      const cur = steps.findIndex((x) => x[0] === job.status);
      wash = `<section class="tk-head"><div class="top"><div><div class="small muted">${esc(pkg(job.pkg).name)}</div><h2>${job.status === 'hazir' ? 'Aracın hazır!' : job.status === 'yikaniyor' ? 'Aracın yıkanıyor' : `Sırada ${pos + 1}. araçsın`}</h2></div><div class="tk-eta"><b>${job.status === 'hazir' ? 'Teslim alabilirsin' : NS.time(eta.toISOString())}</b><span>${job.status === 'hazir' ? 'Kasadan anahtarını al' : `tahmini hazır · yaklaşık ${durTxt(waitMin * 60000)}`}</span></div></div>
        <div class="tk-steps" style="--n:3">${steps.map(([k, l, ic], i) => `<div class="tk-step ${i < cur || job.status === 'hazir' ? 'done' : i === cur ? 'cur' : 'todo'}"><div class="d">${icon(i < cur || job.status === 'hazir' ? 'check' : ic)}</div><b>${l}</b><span></span></div>`).join('')}</div>
        ${job.status === 'bekliyor' && queue.length > 1 ? `<div class="q" aria-label="Yıkama kuyruğu">${queue.slice(0, 14).map((x, i) => `<i class="${x.id === job.id ? 'me' : x.status === 'yikaniyor' ? 'wash' : ''}" title="${x.status === 'yikaniyor' ? 'Yıkanıyor' : 'Sırada'}">${i + 1}</i>`).join('')}</div>` : ''}
        <div class="row between mt"><span class="small muted">Ücret</span><b>${job.price ? money(job.price) : 'Abonelikten'}</b></div></section>`;
    }
    const parkHtml = park ? `<section class="tk-panel"><h3>${icon('car')} Otopark</h3><div class="b"><div class="row between"><span class="small muted">Giriş ${NS.time(park.in)} · <span id="du">${durTxt(Date.now() - new Date(park.in))}</span></span>${sub && sub.plan === 'otopark' ? NS.badge('Abone · ücretsiz', 'ok') : ''}</div>
        <div class="big mt" id="fe">${money(fee(park))}</div><div class="small muted">${park.paidAt ? (Date.now() - new Date(park.paidAt) <= 15 * 60000 ? `Ödendi · ${NS.time(new Date(new Date(park.paidAt).getTime() + 15 * 60000).toISOString())}'e kadar ücretsiz çıkış` : 'Ödeme sonrası süre aşıldı, fark çıkışta alınır') : 'Şu an çıkarsan ödenecek tutar'}</div>
        ${fee(park) > 0 ? '<p class="small mt" style="margin-bottom:0">Ücreti çıkışta gişede ödeyebilirsin.</p>' : ''}
        <p class="small muted" style="margin:10px 0 0">Tarife: ilk saat ${money(S().firstHour)}, sonraki her saat ${money(S().nextHour)}, günlük en fazla ${money(S().dailyMax)}. İlk ${S().graceMin} dk ücretsiz.</p></div></section>` : '';
    const subHtml = sub ? `<section class="tk-panel"><h3>${icon('award')} Aboneliğin</h3><div class="b"><div class="row between"><b>${sub.plan === 'otopark' ? 'Aylık otopark' : 'Aylık 4 yıkama'}</b><span class="small muted">bitiş ${NS.date(sub.end)}</span></div>${sub.washesLeft !== null && sub.washesLeft !== undefined ? `<div class="small mt">Kalan yıkama hakkı: <b>${sub.washesLeft}</b></div>` : ''}</div></section>` : '';
    $('#root').innerHTML = `<div class="tk-view">${finder(pl, kc)}<p style="margin:0 0 16px"><span class="plate"><span>${esc(pl)}</span></span></p>${wash}${parkHtml}${subHtml}<p class="tk-help">${icon('phone')} ${esc(S().bizPhone || '')} · ${esc(S().bizAddress || '')}</p></div>`;
    bind();
    if (park) timer = setInterval(() => { if (!$('#fe')) return clearInterval(timer); db.load(); const p2 = db.get('parks', park.id); if (!p2 || p2.out) return render(pl, kc); $('#fe').textContent = money(fee(p2)); $('#du').textContent = durTxt(Date.now() - new Date(p2.in)); }, 30000);
  }
  const go = (k, c) => { const n = norm(k); const cc = String(c || '').trim().toUpperCase(); history.replaceState(null, '', n ? '?plaka=' + encodeURIComponent(n) + (cc ? '&kod=' + encodeURIComponent(cc) : '') : location.pathname); render(n, cc); };
  const bind = () => { const g = () => go($('#k').value, $('#kc').value); $('#go').onclick = g; $('#k').onkeydown = $('#kc').onkeydown = (e) => { if (e.key === 'Enter') g(); }; };
  on($('#root'), 'click', '[data-ex]', (e, b) => { e.preventDefault(); go(b.dataset.ex, b.dataset.exc); });
  const qs = new URLSearchParams(location.search); let start = qs.get('plaka'), startCode = qs.get('kod') || '';
  if (!start) { try { const v = JSON.parse(localStorage.getItem(RK) || 'null'); if (v && v.pl) { start = v.pl; startCode = v.kc || ''; } } catch (e) { start = ''; } }
  render(start, startCode);
})();
</script>
</body>
</html>
