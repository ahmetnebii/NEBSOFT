<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT Teknik Servis</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
  .kcol { background: var(--bg-2); border-radius: 14px; padding: 10px; min-height: 60vh; }
  .kcol.over { outline: 2px dashed var(--accent); }
  .kcol h4 { display: flex; align-items: center; gap: 8px; margin: 4px 4px 10px; font-size: 13px; }
  .kc { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: grab; box-shadow: var(--shadow); font-size: 12.5px; }
  .kc:active { cursor: grabbing; }
  .kc b { font-size: 13px; }
  .kc.late { box-shadow: 0 0 0 2px var(--err); }
  .timeline { position: relative; padding-left: 22px; }
  .timeline::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
  .tl { position: relative; padding: 0 0 14px; }
  .tl::before { content: ''; position: absolute; left: -20px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--accent)); border: 2px solid var(--surface); }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/integrations.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
