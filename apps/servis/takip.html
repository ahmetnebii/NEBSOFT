<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cihaz Durumu Sorgula</title>
<link rel="stylesheet" href="../../core/core.css">
<link rel="stylesheet" href="../../core/track.css">
<style>:root { --app-accent: #ea580c; --app-accent-soft: #fff1e6; --app-accent-soft-dark: #3a2213; }</style>
</head>
<body>
<header class="tk-bar"><div class="in" id="bar"></div></header>
<main class="tk-wrap" id="root"></main>
<script src="../../core/core.js"></script>
<script src="data.js"></script>
<script>
(function () {
  const { esc, $, $$, on, icon, money, toast, sum, addDays } = NS;
  const SV = window.SERVIS;
  const db = new NS.DB('servis', SV.seed);
  const s = () => db.settings({});
  const wDays = () => Number(s().warrantyDays) || 0; // garanti süresi işletme ayarından gelir; yoksa gösterilmez
  const ST = Object.fromEntries(SV.STATUS.map((x) => [x.id, x]));
  const total = (t) => sum(t.parts, (p) => p.price * p.qty) + (t.labor || 0);
  const paid = (t) => sum(t.payments, (p) => p.amount) + (t.deposit || 0);
  const tel = () => String(s().bizPhone || '').replace(/\D/g, '');
  const RK = 'nebsoft:servis:son';
  const recent = () => { try { return JSON.parse(localStorage.getItem(RK) || '[]'); } catch (e) { return []; } };
  const remember = (c) => { try { localStorage.setItem(RK, JSON.stringify([c, ...recent().filter((x) => x !== c)].slice(0, 4))); } catch (e) { /* yok */ } };
  const log = (t, status, note) => t.log.push({ at: new Date().toISOString(), status, note, user: 'Müşteri (online)' });

  $('#bar').innerHTML = `<div class="tk-mark">${icon('wrench')}</div><div class="grow"><b>${esc(s().bizName)}</b><span>Cihaz durumu sorgulama</span></div>
    <a class="btn ghost" href="tel:${tel()}">${icon('phone')}<span class="hide-sm">${esc(s().bizPhone)}</span></a><button class="btn ghost icon" id="th" data-theme-ico aria-label="Tema">${icon(NS.getTheme() === 'dark' ? 'sun' : 'moon')}</button>`;
  $('#th').onclick = NS.toggleTheme;

  const finder = (code) => `<div class="tk-find"><input class="input" id="k" placeholder="Takip kodu (ör. 7KX2QA)" value="${esc(code || '')}" aria-label="Takip kodu" autocomplete="off"><button class="btn primary lg" id="go">${icon('search')} Sorgula</button></div>
    ${recent().length ? `<div class="tk-recent">Son sorgulananlar: ${recent().map((c) => `<button data-r="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : '<div class="tk-recent"></div>'}`;

  // Cihazın aşamaları; "parça bekleniyor" tamir aşamasının alt durumu olarak gösterilir
  const FLOW = ['kabul', 'inceleme', 'onay', 'tamirde', 'hazir', 'teslim'];
  function steps(t) {
    const cur = FLOW.indexOf(t.status === 'parca' ? 'tamirde' : t.status);
    const when = (f) => { const l = t.log.filter((x) => x.status === f).pop(); return l ? NS.date(l.at) + ' ' + NS.time(l.at) : ''; };
    return `<div class="tk-steps" style="--n:${FLOW.length}">${FLOW.map((f, i) => {
      const c = t.status === 'teslim' || i < cur ? 'done' : i === cur ? 'cur' : 'todo';
      const name = f === 'tamirde' && t.status === 'parca' ? 'Parça bekleniyor' : f === 'onay' ? 'Fiyat onayı' : ST[f].name;
      return `<div class="tk-step ${c}"><div class="d">${icon(c === 'done' ? 'check' : ST[f].icon)}</div><b>${esc(name)}</b><span>${when(f) || (c === 'todo' ? '' : '—')}</span></div>`;
    }).join('')}</div>`;
  }
  const etaText = (t) => {
    if (t.status === 'teslim') return ['Teslim edildi', NS.dateLong(t.delivered || t.log[t.log.length - 1].at)];
    if (t.status === 'hazir') return ['Teslime hazır', 'Dilediğiniz zaman alabilirsiniz'];
    if (t.status === 'iade') return ['İade', 'Cihazınızı teslim alabilirsiniz'];
    const d = Math.ceil((new Date(t.promised) - new Date()) / 864e5);
    return [d <= 0 ? (d === 0 ? 'Bugün' : 'Gecikti, bugün içinde aranacaksınız') : d === 1 ? 'Yarın' : `${d} gün içinde`, 'Tahmini teslim: ' + NS.dateLong(t.promised)];
  };

  function render(code) {
    const k = (code || '').toUpperCase().trim();
    if (!k || db.lookup({ kod: k }) === null) db.load();
    const t = k && db.find('tickets', (x) => x.code === k || x.no === k);
    if (!k) {
      $('#root').innerHTML = `<div class="tk-view"><div class="tk-intro"><h1>Cihazınız ne durumda?</h1><p>Kabul fişinizdeki 6 haneli takip kodunu yazın. Fiyat teklifini buradan onaylayabilir, ${NS.pub ? 'onarımın her aşamasını anlık izleyebilirsiniz' : 'hazır olduğunda ödemenizi yapabilirsiniz'}.</p></div>${finder('')}
        <div class="tk-how"><div>${icon('file')}<b>Kodunuz fişte</b>Cihazı bıraktığınızda verilen kabul fişinin sağ üstünde yazar; SMS ile de gönderilir.</div><div>${icon('check')}<b>Teklifi online onaylayın</b>Arıza tespit edilince fiyat burada görünür. Onayladığınız an onarıma başlarız.</div>${wDays() ? `<div>${icon('shield')}<b>${wDays()} gün garanti</b>Değişen parça ve yapılan işlem teslimden itibaren garantilidir.</div>` : ''}</div></div>`;
      return bind();
    }
    if (!t) { $('#root').innerHTML = `<div class="tk-view">${finder(k)}<div class="tk-panel"><div class="b empty">${icon('search')}<div><b>${esc(k)}</b> koduna ait kayıt bulunamadı.</div><div class="small muted mt">Kodu fişinizden kontrol edin veya bizi arayın: <a href="tel:${tel()}">${esc(s().bizPhone)}</a></div></div></div></div>`; return bind(); }
    remember(t.code);
    const st = ST[t.status]; const [eta, etaSub] = etaText(t);
    const bal = total(t) - paid(t);
    const tech = (db.get('techs', t.tech) || {}).name || '';
    const wEnd = t.warrantyUntil ? new Date(t.warrantyUntil + 'T23:59:59') : t.delivered && wDays() ? addDays(new Date(t.delivered), wDays()) : null; // teslimde yazılan tarih esastır
    const lines = `<table class="tk-lines">${t.parts.map((p) => `<tr><td>${esc(p.name)}${p.qty > 1 ? ` × ${p.qty}` : ''}</td><td>${money(p.price * p.qty)}</td></tr>`).join('')}${t.labor ? `<tr><td>İşçilik</td><td>${money(t.labor)}</td></tr>` : ''}`;

    let call = '';
    if (t.status === 'onay') call = `<div class="tk-call" style="--c:var(--warn)"><h3>${icon('clock')} Onayınızı bekliyoruz</h3><p class="small" style="margin:0 0 12px">${esc(t.diagnosis || 'Arıza tespit edildi.')}</p>
      ${t.parts.length && Math.abs(total(t) - t.estimate) < 0.01 ? lines + `<tr class="t"><td>Toplam (KDV dahil)</td><td>${money(t.estimate)}</td></tr></table>` : `<div class="small muted">Teklif tutarı (KDV dahil)</div><div style="font-size:30px;font-weight:800">${money(t.estimate)}</div>`}
      <label class="check small mt"><input type="checkbox" id="tc"> Onarım koşullarını okudum ve kabul ediyorum.</label>
      <div class="tk-acts mt"><button class="btn ok lg grow" id="ok">${icon('check')} Onaylıyorum, onarılsın</button><button class="btn lg" id="no">Onaylamıyorum</button></div></div>`;
    else if (t.status === 'hazir') call = `<div class="tk-call" style="--c:var(--ok)"><h3>${icon('check')} Cihazınız teslime hazır</h3><p class="small" style="margin:0 0 10px">Onarım tamamlandı ve test edildi. ${esc(s().bizAddress)} adresinden teslim alabilirsiniz.</p>
      <div class="row between"><span>${bal > 0 ? 'Ödenecek tutar' : 'Ödeme'}</span><b style="font-size:24px">${bal > 0 ? money(bal) : 'Tamamlandı'}</b></div>
      <div class="tk-acts mt"><a class="btn lg" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s().bizAddress)}">${icon('map')} Yol tarifi</a></div>
      ${bal > 0 ? `<p class="small muted mt" style="margin-bottom:0">Ödemeyi cihazı teslim alırken yapabilirsiniz.</p>` : ''}</div>`;
    else if (t.status === 'teslim' && wEnd) call = `<div class="tk-call" style="--c:var(--accent)"><h3>${icon('shield')} Garantiniz ${wEnd > new Date() ? `${NS.dateLong(NS.iso(wEnd))} tarihine kadar geçerli` : 'sona erdi'}</h3>
      ${t.review ? `<p class="small" style="margin:0">Değerlendirmeniz için teşekkürler: ${'★'.repeat(t.review.stars)}${'☆'.repeat(5 - t.review.stars)}${t.review.text ? ` — “${esc(t.review.text)}”` : ''}</p>` : `<p class="small" style="margin:0 0 8px">Hizmetimizi nasıl buldunuz?</p><div class="tk-stars" role="radiogroup" aria-label="Puan">${[1, 2, 3, 4, 5].map((n) => `<button data-star="${n}" aria-label="${n} yıldız">★</button>`).join('')}</div><textarea class="input mt" id="rv" rows="2" placeholder="Eklemek istedikleriniz (isteğe bağlı)"></textarea><button class="btn primary mt" id="rvs">Gönder</button>`}</div>`;
    else if (t.status === 'iade') call = `<div class="tk-call" style="--c:var(--err)"><h3>${icon('x')} Cihaz onarılamadı</h3><p class="small" style="margin:0">${esc((t.log.filter((l) => l.status === 'iade').pop() || {}).note || 'Cihazınız teslim alınmayı bekliyor.')} ${Number(s().diagFee) > 0 ? `Arıza tespit ücreti: ${money(Number(s().diagFee))}.` : 'Arıza tespit ücreti alınmaz.'}</p></div>`;
    else if (t.status === 'parca') call = `<div class="tk-call" style="--c:${st.color}"><h3>${icon('truck')} Parça tedarik ediliyor</h3><p class="small" style="margin:0">Gerekli parça siparişi verildi. Parça ulaştığında onarım aynı gün tamamlanır.</p></div>`;

    $('#root').innerHTML = `<div class="tk-view">${finder(t.code)}
      <section class="tk-head"><div class="top"><div><div class="small muted mono">${esc(t.no)} · ${esc(t.type)}</div><h2>${esc(t.brand)} ${esc(t.model)}</h2><span class="tk-pill" style="--c:${st.color}">${esc(st.name)}</span></div><div class="tk-eta"><b>${esc(eta)}</b><span>${esc(etaSub)}</span></div></div>${t.status === 'iade' ? '' : steps(t)}</section>
      <div class="tk-grid"><div>${call}
        <section class="tk-panel"><h3>${icon('list')} Hareketler</h3><div class="b"><ul class="tk-tl">${t.log.slice().reverse().map((l) => `<li><b>${esc((ST[l.status] || {}).name || l.status)}</b>${esc(l.note || '')}<br><span>${NS.dt(l.at)}</span></li>`).join('')}</ul></div></section></div>
        <div><section class="tk-panel"><h3>${icon('file')} Kayıt bilgileri</h3><div class="b"><dl class="tk-dl"><dt>Kabul</dt><dd>${NS.dt(t.received)}</dd><dt>Şikâyet</dt><dd>${esc(t.issue)}</dd><dt>Teslim alınan</dt><dd>${esc(t.accessories || '-')}</dd><dt>Görünüm</dt><dd>${esc(t.condition || '-')}</dd>${tech ? `<dt>Teknisyen</dt><dd>${esc(tech.split(' ')[0])}</dd>` : ''}${t.diagnosis && t.status !== 'onay' ? `<dt>Tespit</dt><dd>${esc(t.diagnosis)}</dd>` : ''}</dl></div></section>
          ${t.parts.length && t.status !== 'onay' ? `<section class="tk-panel"><h3>${icon('receipt')} Ücret</h3><div class="b">${lines}<tr class="t"><td>Toplam</td><td>${money(total(t))}</td></tr></table>${paid(t) ? `<div class="row between small muted"><span>Ödenen</span><span>${money(paid(t))}</span></div>` : ''}</div></section>` : ''}
          <section class="tk-panel"><h3>${icon('phone')} Yardım</h3><div class="b"><div class="tk-acts"><a class="btn grow" href="tel:${tel()}">${icon('phone')} Ara</a><a class="btn grow" target="_blank" rel="noopener" href="https://wa.me/90${tel().replace(/^0/, '')}?text=${encodeURIComponent(`Merhaba, ${t.no} numaralı kaydım (${t.brand} ${t.model}) hakkında bilgi almak istiyorum.`)}">${icon('message')} WhatsApp</a></div><p class="small muted" style="margin:10px 0 0">${esc(s().bizAddress)}</p></div></section></div></div></div>`;
    bind();

    if ($('#ok')) $('#ok').onclick = () => { if (!$('#tc').checked) return toast('Lütfen onarım koşullarını onaylayın', 'err'); db.load(); const x = db.find('tickets', (y) => y.id === t.id); x.approved = true; x.status = 'tamirde'; log(x, 'tamirde', `Müşteri ${money(x.estimate)} teklifi online onayladı`); db.save(); toast('Onayınız alındı, onarıma başlıyoruz', 'ok'); render(t.code); };
    if ($('#no')) $('#no').onclick = async () => {
      const v = await NS.formModal({ title: 'Teklifi onaylamıyorum', fields: [{ name: 'why', label: 'Nedeniniz', type: 'select', options: ['Fiyat yüksek', 'Cihazı yenilemeyi düşünüyorum', 'Başka serviste yaptıracağım', 'Diğer'] }, { name: 'note', label: 'Not (isteğe bağlı)', type: 'textarea', full: true }] });
      if (!v) return; db.load(); const x = db.find('tickets', (y) => y.id === t.id); x.status = 'iade'; log(x, 'iade', `Müşteri teklifi reddetti: ${v.why}${v.note ? ' — ' + v.note : ''}. Cihaz iade edilecek.`); db.save(); render(t.code);
    };
    let stars = 0;
    $$('[data-star]').forEach((b) => { b.onclick = () => { stars = Number(b.dataset.star); $$('[data-star]').forEach((x) => x.classList.toggle('on', Number(x.dataset.star) <= stars)); }; });
    if ($('#rvs')) $('#rvs').onclick = () => { if (!stars) return toast('Lütfen puan verin', 'err'); db.load(); const x = db.find('tickets', (y) => y.id === t.id); x.review = { stars, text: $('#rv').value.trim(), at: new Date().toISOString() }; db.save(); toast('Teşekkür ederiz!', 'ok'); render(t.code); };
  }
  const go = (k) => { history.replaceState(null, '', k ? '?kod=' + encodeURIComponent(k.toUpperCase().trim()) : location.pathname); render(k); };
  const bind = () => { $('#go').onclick = () => go($('#k').value); $('#k').onkeydown = (e) => { if (e.key === 'Enter') go($('#k').value); }; };
  on($('#root'), 'click', '[data-r]', (e, b) => go(b.dataset.r));
  render(new URLSearchParams(location.search).get('kod'));
})();
</script>
</body>
</html>
