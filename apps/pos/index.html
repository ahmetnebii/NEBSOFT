<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT Market POS</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .pos { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; height: calc(100vh - 60px - 34px - 48px); min-height: 560px; }
  .pos-left, .pos-right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .scan { display: flex; gap: 8px; margin-bottom: 12px; }
  .scan .search { flex: 1; max-width: none; }
  .scan .input { height: 52px; font-size: 18px; font-weight: 600; }
  .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; }
  .cat-tabs button { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 99px; font: 600 12.5px var(--font); color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .cat-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 760px) { .cat-tabs button { min-height: 44px; flex: none; } }
  .quick { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; align-content: start; padding: 2px; }
  .qp { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: left; cursor: pointer; font-family: var(--font); color: var(--text); display: flex; flex-direction: column; gap: 6px; min-height: 96px; transition: .12s; position: relative; }
  .qp:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
  .qp .nm { font-weight: 600; font-size: 13px; line-height: 1.3; flex: 1; }
  .qp .pr { font-weight: 800; color: var(--accent); }
  .qp .st { position: absolute; top: 16px; right: 8px; font-size: 10.5px; }
  .qp .nm { padding-right: 26px; }
  .qp .sw { width: 100%; height: 4px; border-radius: 4px; }
  .qp .qp-img { width: 100%; height: 76px; object-fit: contain; border-radius: 8px; background: #fff; }
  .qp.has-img .sw { display: none; }
  .cart { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .cart-mode { padding: 8px 14px; font-weight: 700; text-align: center; background: var(--err); color: #fff; border-radius: 12px 12px 0 0; }
  .lines { flex: 1; overflow-y: auto; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .line:hover { background: var(--surface-2); }
  .line.sel { background: var(--accent-soft); }
  .line .n { font-weight: 600; }
  .line .t { font-weight: 800; text-align: right; }
  .line .meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .qty button { border: 0; background: var(--surface-2); width: 26px; height: 26px; cursor: pointer; color: var(--text); display: grid; place-items: center; }
  .qty span { min-width: 44px; text-align: center; font-weight: 700; font-size: 13px; color: var(--text); }
  .totals { padding: 12px 14px; border-top: 1px solid var(--border); background: var(--surface-2); }
  .totals .r { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); padding: 2px 0; }
  .totals .grand { font-size: 30px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
  .paybtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 14px; }
  .paybtns .btn { height: 54px; flex-direction: column; gap: 2px; font-size: 13px; }
  .paybtns .btn small { font-size: 10px; opacity: .75; font-weight: 500; }
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 14px 12px; }
  .tools .btn { height: 34px; font-size: 11.5px; padding: 0 6px; }
  .cust-chip { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .bills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bills .btn { height: 46px; font-size: 15px; }
  .pay-big { font-size: 40px; font-weight: 800; text-align: center; letter-spacing: -.03em; }
  .label-sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .label { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; background: #fff; color: #000; text-align: center; }
  .label .p { font-size: 22px; font-weight: 800; }
  @media (max-width: 1100px) { .pos { grid-template-columns: minmax(0, 1fr); height: auto; } .quick { max-height: 360px; } .cart { min-height: 480px; } }
  @media (max-width: 600px) { .scan .btn.lg:not(.icon) { display: none; } .scan .input { font-size: 15px; height: 46px; } .quick { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); } .paybtns .btn small { display: none; } }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/inbox.js"></script>
<script src="../../core/integrations.js"></script>
<script src="hizli.js"></script>
<script src="app.js"></script>
</body>
</html>
