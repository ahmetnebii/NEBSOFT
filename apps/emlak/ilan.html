<body>
<div id="root"></div>
<script src="../../core/core.js"></script>
<script src="data.js"></script>
<script>
/* Emlak ofisi web sitesi — NEBSOFT Emlak paneliyle aynı veriyi kullanır (ilan, danışman, talep, gösterim, web başvuruları) */
(function () {
  const { esc, $, $$, on, icon, money, num, toast } = NS;
  document.documentElement.dataset.theme = 'light';
  const E = window.EMLAK;
  const db = new NS.DB('emlak', E.seed);
  const s = () => db.settings({ commission: 2, rentCommission: 100 });
  const agent = (id) => db.get('agents', id) || { name: s().bizName, phone: s().bizPhone, color: '#0f2a44' };
  const live = () => db.all('props', (p) => ['aktif', 'opsiyon'].includes(p.status));
  const ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* yok */ } };
  const FK = 'nebsoft:emlak:fav', CK = 'nebsoft:emlak:cmp', RK = 'nebsoft:emlak:recent';
  let favs = ls(FK, []), cmp = ls(CK, []);
  const tl = (n) => money(n).replace(',00', '');
  const short = (n) => (n >= 1e6 ? (n / 1e6).toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' M ₺' : n >= 1e3 ? Math.round(n / 1e3) + ' B ₺' : tl(n));
  const tel = (ph) => String(ph || '').replace(/\s/g, '');
  const wa = (text, ph) => `https://wa.me/90${String(ph || s().whatsapp || s().bizPhone).replace(/\D/g, '').replace(/^0/, '')}?text=${encodeURIComponent(text)}`;
  const pic = (p, i = 0, w = 800, h = 0) => { const a = E.photos(p); return E.imgUrl(a[i % a.length], w, h); };
  const FB = `data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 11"><rect width="16" height="11" fill="#dfe3e8"/><path d="M5 8l2-3 2 2 1-1 2 2z" fill="#b8c0ca"/></svg>')}`;
  const imgT = (p, i, w, h) => `<img src="${pic(p, i, w, h)}" alt="${esc(p.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FB}'">`;
  const isNew = (p) => (Date.now() - new Date(p.created)) / 864e5 < 10;
  const url = (p) => location.href.split('#')[0].split('?')[0] + '#/ilan/' + p.id;
  const districts = () => Object.keys(E.GEO);

  function card(p, row) {
    return `<article class="lc ${row ? 'row2' : ''}"><a class="ph" href="#/ilan/${p.id}">${imgT(p, 0, 640, 440)}<div class="tg"><span class="k">${E.TYPE[p.type]}</span>${isNew(p) ? '<span class="g">Yeni</span>' : ''}${p.status === 'opsiyon' ? '<span class="o">Opsiyonlu</span>' : ''}${p.views > 600 ? '<span>Popüler</span>' : ''}</div><div class="cnt">${icon('eye')} ${num(p.views)} · ${E.photos(p).length} foto</div></a>
      <div class="acts"><button data-fav="${p.id}" class="${favs.includes(p.id) ? 'on' : ''}" title="Favorilere ekle" aria-label="Favori">${icon('heart')}</button><button data-cmp="${p.id}" class="cm ${cmp.includes(p.id) ? 'on' : ''}" title="Karşılaştır" aria-label="Karşılaştır">${icon('layers')}</button></div>
      <div class="bd"><div class="pr">${tl(p.price)}${p.type === 'kiralik' ? ' <small>/ ay</small>' : ''}</div><a href="#/ilan/${p.id}"><h3>${esc(p.title)}</h3></a><div class="loc">${icon('map')} ${esc(p.nb)}, ${esc(p.district)} / ${esc(p.city || 'İzmir')}</div>
      <div class="spec">${p.rooms !== '-' ? `<span>${icon('bed')} ${esc(p.rooms)}</span>` : `<span>${icon('building')} ${esc(p.cat)}</span>`}<span>${icon('grid')} ${num(p.m2)} m²</span>${p.cat === 'Arsa' ? `<span>${icon('tag')} ${tl(Math.round(p.price / p.m2))}/m²</span>` : `<span>${icon('calendar')} ${p.age ? p.age + ' yaş' : 'Sıfır'}</span>`}</div></div></article>`;
  }

  // ---------- çerçeve ----------
  function frame() {
    const st = s();
    $('#root').innerHTML = `<div class="tb0"><div class="w"><span>${icon('phone')} ${esc(st.bizPhone)}</span><span>${icon('map')} ${esc(st.bizAddress)}</span><span class="grow"></span><a href="#/degerleme">Ücretsiz değerleme</a><a href="#/iletisim">İletişim</a></div></div>
      <header class="hd"><div class="w"><a class="brand" href="#/"><i>${icon('building')}</i><span><b>${esc(st.bizName)}</b><small>Gayrimenkul danışmanlığı</small></span></a>
        <nav class="nv"><a href="#/ilanlar?tip=satilik" data-n="satilik">Satılık</a><a href="#/ilanlar?tip=kiralik" data-n="kiralik">Kiralık</a><a href="#/ilanlar?gor=harita" data-n="harita">Harita</a><a href="#/degerleme" data-n="degerleme">Evim ne eder?</a><a href="#/iletisim" data-n="iletisim">İletişim</a></nav>
        <div class="hb"><a class="ib" href="#/favoriler" title="Favoriler">${icon('heart')}<span class="n hide" id="fn"></span></a><a class="ib" href="#/karsilastir" title="Karşılaştır">${icon('layers')}<span class="n hide" id="cn"></span></a><a class="b gd" href="#/iletisim?k=portfoy">${icon('plus')} Mülkünü listele</a><button class="ib mob" id="mm" aria-label="Menü">${icon('menu')}</button></div></div></header>
      <main id="pg"></main><div id="cmpw"></div>
      <footer class="ft"><div class="w"><div class="fcols"><div><div class="brand" style="color:#fff"><i>${icon('building')}</i><span><b>${esc(st.bizName)}</b><small style="color:#7f93a8">Gayrimenkul danışmanlığı</small></span></div><p style="margin-top:16px;line-height:1.7;max-width:320px">Doğru fiyat, doğru alıcı, güvenli işlem. Yetki belgeli portföy, ekspertiz desteği ve tapuya kadar uçtan uca hizmet.</p></div>
        <div><h5>İlanlar</h5><a href="#/ilanlar?tip=satilik">Satılık konutlar</a><a href="#/ilanlar?tip=kiralik">Kiralık konutlar</a><a href="#/ilanlar?kat=Villa">Villalar</a><a href="#/ilanlar?kat=İşyeri">İşyerleri</a><a href="#/ilanlar?kat=Arsa">Arsalar</a></div>
        <div><h5>Hizmetler</h5><a href="#/degerleme">Ücretsiz değerleme</a><a href="#/iletisim?k=portfoy">Mülkünü listele</a><a href="#/ilanlar?gor=harita">Haritada ara</a><a href="#/karsilastir">İlan karşılaştır</a><a href="#/favoriler">Favorilerim</a></div>
        <div><h5>İletişim</h5><a href="tel:${esc(tel(st.bizPhone))}">${icon('phone')} ${esc(st.bizPhone)}</a><a href="${wa('Merhaba, bilgi almak istiyorum.')}" target="_blank" rel="noopener">${icon('message')} WhatsApp hattı</a><a>${icon('map')} ${esc(st.bizAddress)}</a><a>${icon('clock')} Hafta içi 09:00–19:00 · Cmt 10:00–17:00</a></div></div>
        <div class="lg2"><span>© ${new Date().getFullYear()} ${esc(st.bizName)} · Taşınmaz Ticareti Yetki Belgesi No: ${esc(st.yetkiNo || 'girilmedi')}</span><span>NEBSOFT Emlak altyapısı ile</span></div></div></footer>`;
    $('#mm').onclick = () => NS.modal({ title: 'Menü', body: [['#/ilanlar?tip=satilik', 'Satılık ilanlar'], ['#/ilanlar?tip=kiralik', 'Kiralık ilanlar'], ['#/ilanlar?gor=harita', 'Haritada ara'], ['#/degerleme', 'Evim ne eder?'], ['#/favoriler', `Favorilerim (${favs.length})`], ['#/karsilastir', `Karşılaştır (${cmp.length})`], ['#/iletisim?k=portfoy', 'Mülkünü listele'], ['#/iletisim', 'İletişim']].map(([h, l]) => `<a href="${h}" data-mclose style="display:block;padding:14px 4px;border-bottom:1px solid var(--border);font-weight:600">${l}</a>`).join('') });
    drawCounts();
  }
  function drawCounts() {
    const f = $('#fn'), c = $('#cn'); if (f) { f.textContent = favs.length; f.classList.toggle('hide', !favs.length); } if (c) { c.textContent = cmp.length; c.classList.toggle('hide', !cmp.length); }
    const wv = $('#cmpw'); if (!wv) return;
    wv.innerHTML = cmp.length && !location.hash.startsWith('#/karsilastir') ? `<div class="cmpbar">${icon('layers')} <span><b>${cmp.length}</b> ilan seçildi</span><a class="b gd sm" href="#/karsilastir">Karşılaştır</a><button class="b sm" style="background:none;border-color:#3b5470" data-cmpclr>Temizle</button></div>` : '';
  }
  function toggleFav(id) { const i = favs.indexOf(id); if (i >= 0) favs.splice(i, 1); else favs.push(id); lsSet(FK, favs); $$(`[data-fav="${id}"]`).forEach((b) => b.classList.toggle('on', i < 0)); drawCounts(); toast(i >= 0 ? 'Favorilerden çıkarıldı' : 'Favorilere eklendi', 'ok'); }
  function toggleCmp(id) { const i = cmp.indexOf(id); if (i >= 0) cmp.splice(i, 1); else { if (cmp.length >= 3) return toast('En fazla 3 ilan karşılaştırabilirsiniz', 'err'); cmp.push(id); } lsSet(CK, cmp); $$(`[data-cmp="${id}"]`).forEach((b) => b.classList.toggle('on', cmp.includes(id))); drawCounts(); }

  // Web başvurusu: paneldeki "Web başvuruları" sayfasına düşer
  function lead(kind, data) { db.load(); const l = db.insert('leads', { kind, status: 'yeni', at: new Date().toISOString(), ...data }); return l; }
  // Talep (alıcı/kiracı kriteri): paneldeki eşleştirme motoruna girer
  function addRequest(d) { return db.insert('requests', { status: 'aktif', created: new Date().toISOString(), source: 'web', cat: 'Daire', ...d }); }

  // ---------- ana sayfa ----------
  function home(el) {
    const L = live(); const ag = db.all('agents');
    const sold = db.all('deals').length;
    const featured = L.slice().sort((a, b) => b.views - a.views).slice(0, 6);
    const fresh = L.slice().sort((a, b) => b.created.localeCompare(a.created)).slice(0, 6);
    const dists = districts().map((d) => [d, L.filter((p) => p.district === d)]).sort((a, b) => b[1].length - a[1].length).slice(0, 5);
    const dpic = [E.PH.villa[0], E.PH.apt[0], E.PH.house[2], E.PH.apt[1], E.PH.house[5]];
    const avgSale = (ps) => { const x = ps.filter((p) => p.type === 'satilik'); return x.length ? Math.round(x.reduce((a, p) => a + p.price, 0) / x.length) : 0; };
    let tip = 'satilik';
    el.innerHTML = `<section class="hero"><img src="${E.imgUrl(E.PH.villa[1], 2000)}" alt=""><div class="w"><div class="eyb">${esc(s().bizAddress)}</div><h1 class="disp">Hayalinizdeki eve<br>bir adım daha yakın</h1><p>${L.length} güncel ilan ve bölgeyi tanıyan danışmanlar. Doğru evi birlikte bulalım.</p>
      <div class="sbox"><div class="stabs"><button data-tip="satilik" class="on">Satılık</button><button data-tip="kiralik">Kiralık</button></div><form class="sf" id="sf"><label>Konum<select name="ilce" data-nosearch><option value="">Tüm ilçeler</option>${districts().map((d) => `<option>${d}</option>`).join('')}</select></label><label>Emlak tipi<select name="kat" data-nosearch><option value="">Tümü</option><option>Daire</option><option>Villa</option><option>İşyeri</option><option>Arsa</option></select></label><label>Oda sayısı<select name="oda" data-nosearch><option value="">Farketmez</option><option>1+1</option><option>2+1</option><option>3+1</option><option>4+1</option><option>5+1</option></select></label><label>En fazla fiyat<select name="max" data-nosearch><option value="">Limitsiz</option></select></label><button class="b gd">${icon('search')} İlan ara</button></form></div>
      <div class="stats"><div><b>${L.length}</b><span>Aktif ilan</span></div><div><b>${sold}</b><span>Tamamlanan işlem</span></div><div><b>${ag.length}</b><span>Danışman</span></div></div></div></section>
      <section class="sec"><div class="w"><div class="sh"><div class="grow"><div class="eyb">Öne çıkanlar</div><h2 class="disp">En çok ilgi gören ilanlar</h2></div><a class="lk" href="#/ilanlar?sira=pop">Tüm ilanlar →</a></div><div class="lg">${featured.map((p) => card(p)).join('')}</div></div></section>
      <section class="sec"><div class="w"><div class="sh"><div class="grow"><div class="eyb">Bölgeler</div><h2 class="disp">Popüler semtler</h2></div></div><div class="dg">${dists.map(([d, ps], i) => `<a class="dt" href="#/ilanlar?ilce=${encodeURIComponent(d)}"><img src="${E.imgUrl(dpic[i], i ? 600 : 1000)}" alt="${d}" loading="lazy"><div><b>${d}</b>${ps.length} ilan${avgSale(ps) ? ' · ort. ' + short(avgSale(ps)) : ''}</div></a>`).join('')}</div></div></section>
      <section class="sec"><div class="w"><div class="sh"><div class="grow"><div class="eyb">Yeni eklenenler</div><h2 class="disp">Portföye son girenler</h2></div><a class="lk" href="#/ilanlar?sira=yeni">Tümünü gör →</a></div><div class="lg">${fresh.map((p) => card(p)).join('')}</div></div></section>
      <section class="sec"><div class="w"><div class="cta"><div><div class="eyb">Ücretsiz değerleme</div><h2 class="disp">Eviniz bugün kaç para eder?</h2><p style="opacity:.8;margin-top:14px;line-height:1.7;max-width:520px">Bölgedeki güncel ilan ve satış verilerinden anında tahmini değer aralığı alın; isterseniz uzmanımız yerinde ekspertiz yapsın.</p></div><div class="row" style="gap:10px;position:relative;z-index:1"><a class="b gd" href="#/degerleme">${icon('gauge')} Hemen hesapla</a><a class="b ol" href="#/iletisim?k=portfoy" style="background:transparent;color:#fff;border-color:#3b5470">Mülkümü listele</a></div></div></div></section>
      <section class="sec"><div class="w"><div class="sh"><div class="grow"><div class="eyb">Neden biz?</div><h2 class="disp">Nasıl çalışıyoruz?</h2></div></div><div class="why">${[['shield', 'Yazılı yetkilendirme', 'İlanlar mal sahibiyle yapılan yetkilendirme sözleşmesine dayanır.'], ['gauge', 'Bölge bilgisi', 'Fiyat görüşmesinde bölgedeki güncel ilanları birlikte değerlendiririz.'], ['file', 'Süreç desteği', 'Sözleşme ve tapu sürecinde size eşlik ederiz.'], ['message', 'İletişim', 'WhatsApp, telefon veya web formundan ulaşabilirsiniz.']].map(([ic, t, d]) => `<div><i>${icon(ic)}</i><b>${t}</b><p>${d}</p></div>`).join('')}</div></div></section>
      <section class="sec"><div class="w"><div class="sh"><div class="grow"><div class="eyb">Ekibimiz</div><h2 class="disp">Danışmanlarımız</h2></div></div><div class="team">${ag.map((a) => `<div class="tm"><div class="av" style="background:${a.color || '#0f2a44'}">${esc(NS.initials(a.name))}</div><div class="grow"><b>${esc(a.name)}</b><div class="small muted">${L.filter((p) => p.agent === a.id).length} aktif ilan</div><div class="row" style="gap:6px;margin-top:10px"><a class="b sm ol" href="tel:${esc(tel(a.phone))}" aria-label="Ara">${icon('phone')}</a><a class="b sm wa" target="_blank" rel="noopener" href="${wa('Merhaba ' + a.name + ', bilgi almak istiyorum.', a.phone)}">${icon('message')} WhatsApp</a><a class="b sm ol" href="#/ilanlar?dan=${a.id}">İlanları</a></div></div></div>`).join('')}</div></div></section>
      ${recent()}`;
    const fillMax = () => { const opts = tip === 'satilik' ? [2e6, 3e6, 5e6, 7.5e6, 1e7, 1.5e7, 2.5e7] : [15000, 20000, 25000, 35000, 50000, 75000]; $('[name=max]', el).innerHTML = '<option value="">Limitsiz</option>' + opts.map((v) => `<option value="${v}">${short(v)}</option>`).join(''); };
    fillMax();
    on(el, 'click', '[data-tip]', (e, b) => { tip = b.dataset.tip; $$('[data-tip]', el).forEach((x) => x.classList.toggle('on', x === b)); fillMax(); });
    $('#sf', el).onsubmit = (e) => { e.preventDefault(); const f = new FormData(e.target); const q = new URLSearchParams({ tip }); for (const [k, v] of f) if (v) q.set(k, v); location.hash = '#/ilanlar?' + q; };
  }
  function recent() { const r = ls(RK, []).map((id) => db.get('props', id)).filter(Boolean).slice(0, 3); return r.length ? `<section class="sec"><div class="w"><div class="sh"><div class="grow"><div class="eyb">Geçmişiniz</div><h2 class="disp">Son baktığınız ilanlar</h2></div></div><div class="lg">${r.map((p) => card(p)).join('')}</div></div></section>` : ''; }

  // ---------- harita (Leaflet + OpenStreetMap, ihtiyaç olunca yüklenir) ----------
  let leafletP = null;
  const leaflet = () => leafletP || (leafletP = new Promise((res, rej) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; sc.onload = () => res(window.L); sc.onerror = () => { leafletP = null; rej(new Error('harita')); }; document.head.appendChild(sc);
  }));
  function mapInto(box, props, single) {
    leaflet().then((L) => {
      if (!document.body.contains(box)) return;
      const m = L.map(box, { scrollWheelZoom: !single }); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
      const pts = props.map((p) => { const g = E.geo(p); const mk = L.marker(g, { icon: L.divIcon({ html: `<span class="pm ${p.type === 'kiralik' ? 'k' : ''}">${esc(p.label || short(p.price))}</span>`, iconSize: [0, 0] }) }).addTo(m); if (!p.label) mk.bindPopup(`<a href="#/ilan/${p.id}" style="display:block;width:220px"><img src="${pic(p, 0, 440, 280)}" style="width:100%;border-radius:8px;aspect-ratio:16/10;object-fit:cover" alt=""><b style="display:block;margin-top:6px">${tl(p.price)}</b><span style="font-size:12px">${esc(p.title)}</span></a>`); return g; });
      if (single && pts[0]) { m.setView(pts[0], 15); if (!props[0].label) L.circle(pts[0], { radius: 250, color: '#c8a24a', fillOpacity: 0.12 }).addTo(m); } else if (pts.length) m.fitBounds(pts, { padding: [40, 40] }); else m.setView([38.43, 27.14], 11);
    }).catch(() => { box.innerHTML = `<div style="display:grid;place-items:center;height:100%;text-align:center;color:var(--text-3);padding:20px">Harita yüklenemedi (internet bağlantısı gerekli).<br>${props.length} konum listede görüntüleniyor.</div>`; });
  }

  // ---------- liste ----------
  function listPage(el, q, fixed) {
    const narrow = matchMedia('(max-width: 860px)').matches;
    const F = { tip: q.get('tip') || '', kat: q.get('kat') || '', ilce: q.get('ilce') || '', oda: (q.get('oda') || '').split(',').filter(Boolean), min: q.get('min') || '', max: q.get('max') || '', m2min: q.get('m2min') || '', m2max: q.get('m2max') || '', yas: q.get('yas') || '', ozl: (q.get('ozl') || '').split(',').filter(Boolean), esya: q.get('esya') === '1', dan: q.get('dan') || '', ara: q.get('ara') || '' };
    let sort = q.get('sira') || 'yeni', view = q.get('gor') || 'grid', shown = 12;
    const feats = [...new Set(db.all('props').flatMap((p) => p.features || []))].sort((a, b) => a.localeCompare(b, 'tr'));
    const base = fixed || live();
    const title = fixed ? 'Favorilerim' : F.tip === 'satilik' ? 'Satılık ilanlar' : F.tip === 'kiralik' ? 'Kiralık ilanlar' : F.kat ? F.kat.split(',').join(', ') + ' ilanları' : view === 'harita' ? 'Haritada ilanlar' : 'Tüm ilanlar';
    const sync = () => { const p = new URLSearchParams(); Object.entries(F).forEach(([k, v]) => { if (Array.isArray(v) ? v.length : v) p.set(k, Array.isArray(v) ? v.join(',') : v === true ? '1' : v); }); if (sort !== 'yeni') p.set('sira', sort); if (view !== 'grid') p.set('gor', view); history.replaceState(null, '', `#/${fixed ? 'favoriler' : 'ilanlar'}${p.toString() ? '?' + p : ''}`); };
    el.innerHTML = `<div class="w"><div class="crumb"><a href="#/">Ana sayfa</a> / ${esc(title)}</div><div class="lay"><aside class="flt" id="flt">${narrow ? `<div class="row" style="padding-top:14px"><b class="grow" style="font-size:18px">Filtreler</b><button class="ib" data-fclose aria-label="Kapat">${icon('x')}</button></div>` : ''}
        <h4>İlan türü</h4><div class="seg2">${[['', 'Tümü'], ['satilik', 'Satılık'], ['kiralik', 'Kiralık']].map(([v, l]) => `<button data-ft="${v}">${l}</button>`).join('')}</div>
        <h4>Anahtar kelime</h4><input class="fi" id="fq" placeholder="Mahalle, ilan no, özellik…" value="${esc(F.ara)}">
        <h4>Konum</h4><select class="fi" id="fil" data-nosearch><option value="">Tüm ilçeler</option>${districts().map((d) => `<option ${F.ilce === d ? 'selected' : ''}>${d}</option>`).join('')}</select>
        <h4>Emlak tipi</h4><div class="chk">${['Daire', 'Villa', 'İşyeri', 'Arsa'].map((k) => `<button data-fk="${k}">${k}</button>`).join('')}</div>
        <h4>Oda sayısı</h4><div class="chk">${['1+1', '2+1', '3+1', '4+1', '5+1'].map((k) => `<button data-fo="${k}">${k}</button>`).join('')}</div>
        <h4>Fiyat (₺)</h4><div class="two"><input class="fi" id="fmin" data-plain inputmode="numeric" placeholder="En az" value="${esc(F.min)}"><input class="fi" id="fmax" data-plain inputmode="numeric" placeholder="En çok" value="${esc(F.max)}"></div>
        <h4>Alan (m²)</h4><div class="two"><input class="fi" id="fm1" data-plain inputmode="numeric" placeholder="En az" value="${esc(F.m2min)}"><input class="fi" id="fm2" data-plain inputmode="numeric" placeholder="En çok" value="${esc(F.m2max)}"></div>
