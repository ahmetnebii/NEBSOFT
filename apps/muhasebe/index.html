<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT Ön Muhasebe</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .inv-lines .input { height: 34px; }
  .inv-lines td { padding: 6px; }
  .acc-card { padding: 18px; border-radius: 16px; color: #fff; position: relative; overflow: hidden; }
  .acc-card::after { content: ''; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .acc-card .v { font-size: 24px; font-weight: 800; margin-top: 8px; }
  .form-grid.inv-head { grid-template-columns: 2fr 1fr 1fr 1fr 1fr; }
  .inv-lines tr.ln-x td { background: var(--surface-2, rgba(0,0,0,.03)); }
  .mt-xs { margin-top: 4px; }
  /* Telefonda fatura: başlık 2 sütun, kalemler kart görünümü */
  @media (max-width: 700px) {
    .form-grid.inv-head { grid-template-columns: 1fr 1fr; }
    .form-grid.inv-head .field:first-child { grid-column: 1 / -1; }
    .inv-lines thead { display: none; }
    .inv-lines, .inv-lines tbody { display: block; width: 100%; }
    .inv-lines tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .inv-lines td { display: block; padding: 0 !important; border: 0 !important; text-align: left !important; }
    .inv-lines td:first-child, .inv-lines td.ln-act, .inv-lines tr.ln-x td { grid-column: 1 / -1; }
    .inv-lines td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; color: var(--muted, #6b7280); margin-bottom: 2px; }
    .inv-lines td .input { width: 100% !important; min-width: 0; }
    .inv-lines td.ln-act { display: flex; justify-content: flex-end; gap: 6px; }
    .inv-lines tr.ln-x { display: block; }
  }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/integrations.js"></script>
<script src="../../core/ebelge/kodlar.js"></script>
<script src="calc.js"></script>
<script src="beyan.js"></script>
<script src="app.js"></script>
</body>
</html>
