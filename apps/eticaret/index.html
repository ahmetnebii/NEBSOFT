<!doctype html>
<html lang="tr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT E-ticaret</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .pimg { width: 44px; height: 54px; border-radius: 10px; display: grid; place-items: center; font-size: 24px; flex: none; }
  .sw { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 1px solid var(--border); vertical-align: -3px; }
  .vgrid { border-collapse: collapse; font-size: 13px; }
  .vgrid th, .vgrid td { border: 1px solid var(--border); padding: 4px 6px; text-align: center; }
  .vgrid input { width: 58px; height: 30px; text-align: center; }
  .steps-o { display: flex; gap: 6px; }
  .steps-o div { flex: 1; text-align: center; font-size: 11px; color: var(--text-3); }
  .steps-o div i { display: block; height: 6px; border-radius: 6px; background: var(--border); margin-bottom: 4px; }
  .steps-o div.on { color: var(--text); font-weight: 600; } .steps-o div.on i { background: var(--accent); }
</style>
</head>
