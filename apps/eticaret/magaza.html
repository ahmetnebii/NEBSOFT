<div id="app"></div>
<script src="../../core/core.js"></script>
<script src="data.js"></script>
<script>
/* Lina Butik vitrin sitesi — NEBSOFT E-ticaret yönetim paneliyle aynı veriyi kullanır (ürün, stok, sipariş, kupon, iade, yorum) */
(function () {
  const { esc, $, $$, on, icon, money, toast, sum } = NS;
  document.documentElement.dataset.theme = 'light';
  const SH = window.SHOP;
  const db = new NS.DB('eticaret', SH.seed);
  SH.ensureReviews(db);
  const CK = 'nebsoft:eticaret:cart', FK = 'nebsoft:eticaret:fav', RK = 'nebsoft:eticaret:recent';
  const ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* yok */ } };
  let cart = ls(CK, { items: [], coupon: null }); let favs = ls(FK, []);
  const saveCart = () => { lsSet(CK, cart); drawHead(); };
  const s = () => db.settings({ freeShip: 750, shipFee: 79, codFee: 30 });
  const products = () => db.all('products', (p) => p.active !== false);
  const img = (p, i = 0, w = 600) => { const a = SH.photos(p); return SH.imgUrl(a[i % a.length], w, Math.round(w * 4 / 3)); };
  const imgTag = (p, i, w, cls = '') => `<img class="${cls}" src="${img(p, i, w)}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='${SH.fallback(p)}'">`;
  const pctOff = (p) => (p.sale ? Math.round((1 - p.sale / p.price) * 100) : 0);
  const priceHtml = (p) => (p.sale ? `<div class="pr"><span class="o">${money(p.sale)}</span><s>${money(p.price)}</s></div>` : `<div class="pr">${money(p.price)}</div>`);
  const starStr = (r) => '★★★★★'.slice(0, Math.round(r)) + '☆☆☆☆☆'.slice(0, 5 - Math.round(r));

          <div class="row between small" style="margin-top:16px"><span>Ara toplam</span><span>${money(t.sub)}</span></div>${t.discount ? `<div class="row between small" style="color:#15803d"><span>İndirim</span><span>-${money(t.discount)}</span></div>` : ''}<div class="row between small"><span>Kargo</span><span>${t.shipping ? money(t.shipping) : 'Ücretsiz'}</span></div>${t.cod ? `<div class="row between small"><span>Kapıda ödeme</span><span>${money(t.cod)}</span></div>` : ''}
          <div class="row between" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)"><b>Toplam</b><b style="font-size:26px">${money(t.total)}</b></div><div class="small muted">KDV dahil</div>
          <label class="small" style="display:flex;gap:8px;margin-top:16px;cursor:pointer"><input type="checkbox" id="ag" style="accent-color:#141414"> <span><a href="#/sayfa/on-bilgilendirme" target="_blank" style="text-decoration:underline">Ön bilgilendirme formunu</a> ve <a href="#/sayfa/sozlesme" target="_blank" style="text-decoration:underline">mesafeli satış sözleşmesini</a> okudum, onaylıyorum.</span></label>
          <button class="bt" id="po" style="width:100%;justify-content:center;margin-top:14px">${icon('lock')} Siparişi onayla · ${money(t.total)}</button>${NS.pub ? '' : '<p class="small center mt" style="color:var(--sale)"><b>TEST mağaza:</b> gerçek ödeme alınmaz; sipariş "ödeme alınmadı" olarak kaydedilir.</p>'}</div></div></div></div>`;
      const keep = () => { cart.addr = { ...NS.readForm($('#af', el)) }; };
      $('[name=corp]', el).onchange = (e) => { $('#corpf', el).style.display = e.target.checked ? 'block' : 'none'; };
      $$('[name=pay]', el).forEach((r) => { r.onchange = () => { keep(); pay = r.value; draw(); }; });
      $$('[name=inst]', el).forEach((r) => { r.onchange = () => { inst = Number(r.value); }; });
      if ($('#cn', el)) {
        $('#cn', el).oninput = (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 16); e.target.value = d.replace(/(.{4})/g, '$1 ').trim(); $('#cnv', el).textContent = (e.target.value + ' •••• •••• •••• ••••').slice(0, 19); $('#cbr', el).textContent = /^4/.test(d) ? 'VISA' : /^5[1-5]/.test(d) ? 'MASTERCARD' : /^9792/.test(d) ? 'TROY' : /^3[47]/.test(d) ? 'AMEX' : 'KART'; };
        $('#ch', el).oninput = (e) => { $('#chv', el).textContent = e.target.value.toLocaleUpperCase('tr-TR') || 'AD SOYAD'; };
        $('#ce', el).oninput = (e) => { let d = e.target.value.replace(/\D/g, '').slice(0, 4); if (d.length > 2) d = d.slice(0, 2) + '/' + d.slice(2); e.target.value = d; $('#cev', el).textContent = d || 'AA/YY'; };
      }
      $('#cpb', el).onclick = () => { keep(); const code = $('#cp', el).value.trim().toUpperCase(); if (code) db.pubQuery({ coupon: code }); const k = db.find('coupons', (c) => c.code === code && c.active); if (code && !k) toast('Geçersiz indirim kodu', 'err'); cart.coupon = k ? code : null; saveCart(); draw(); };
      $('#po', el).onclick = () => {
        if (!NS.validate($('#af', el))) return;
        if (pay === 'kart') { const n = ($('#cn', el).value || '').replace(/\D/g, ''); const ex = $('#ce', el).value; if (n.length < 15 || !/^\d{2}\/\d{2}$/.test(ex) || ($('#cv', el).value || '').length < 3 || !$('#ch', el).value.trim()) return toast('Kart bilgilerini eksiksiz girin', 'err'); }
        if (!$('#ag', el).checked) return toast('Sözleşmeleri onaylayın', 'err');
        db.load();
        const a = NS.readForm($('#af', el));
        for (const i of cart.items) { const v = (db.get('products', i.pid) || { variants: [] }).variants.find((x) => x.id === i.vid); if (!v || v.stock < i.qty) return toast(`${i.name} (${i.variant}) için stok yetersiz`, 'err'); }
        cart.items.forEach((i) => { db.get('products', i.pid).variants.find((x) => x.id === i.vid).stock -= i.qty; });
        let c = db.find('customers', (x) => String(x.phone).replace(/\D/g, '').slice(-10) === String(a.phone).replace(/\D/g, '').slice(-10));
        if (!c) c = db.insert('customers', { name: a.name, phone: a.phone, email: a.email, city: a.city, address: `${a.address} ${a.district}` }, true);
        const tt = SH.totals(db, cart.items, cart.coupon, pay);
        if (tt.coupon) tt.coupon.uses = (tt.coupon.uses || 0) + 1;
        const o = db.insert('orders', { no: db.nextNo('orders', 'LB'), at: new Date().toISOString(), customer: c.id, ship: { name: a.name, phone: a.phone, city: a.city, district: a.district, address: `${a.address} ${a.district}/${a.city}` }, items: cart.items.map((i) => ({ ...i })), subtotal: tt.sub, discount: tt.discount, shipping: tt.shipping, cod: tt.cod, total: tt.total, pay, installment: pay === 'kart' ? inst : 1, status: 'yeni',
          // Ödeme sağlayıcısı bağlı olmadığı için kartla ödeme TEST'tir: sipariş ödenmiş sayılmaz (havale: dekont beklenir, kapıda: teslimde)
          payStatus: pay === 'kapida' ? 'kapida' : 'bekliyor', payTest: pay === 'kart', coupon: tt.coupon ? tt.coupon.code : null, channel: 'Web sitesi', note: a.note || '', invoice: a.corp ? { title: a.title, taxNo: a.taxNo, taxOffice: a.taxOffice } : null });
        cart = { items: [], coupon: null, addr: { name: a.name, phone: a.phone, email: a.email, city: a.city, district: a.district, address: a.address } }; saveCart();
        location.hash = '#/tesekkurler/' + o.no;
      };
    };
    draw();
  }
  function thanks(el, no) {
    const o = db.find('orders', (x) => x.no === no);
    el.innerHTML = `<div class="w"><div class="steps"><div class="on">1 · Sepet</div><div class="on">2 · Teslimat</div><div class="on">3 · Ödeme</div><div class="on">4 · Onay</div></div><div style="max-width:640px;margin:20px auto 70px;text-align:center"><div style="width:72px;height:72px;border-radius:50%;background:#f0fdf4;color:#15803d;display:grid;place-items:center;margin:0 auto">${icon('check', 'ico-lg')}</div><h1 class="serif" style="font-size:44px;margin-top:18px">Teşekkür ederiz!</h1><p class="muted mt">Siparişiniz alındı. Sipariş numaranız <b>${esc(no)}</b>. Durumunu “Sipariş takibi” sayfasından izleyebilirsiniz.</p>
      ${o ? `<div class="box" style="text-align:left;margin-top:26px">${o.items.map((i) => `<div class="row between small" style="padding:6px 0"><span>${i.qty} × ${esc(i.name)} <span class="muted">${esc(i.variant)}</span></span><b>${money(i.price * i.qty)}</b></div>`).join('')}<div class="row between" style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px"><b>Toplam</b><b>${money(o.total)}</b></div>${o.pay === 'havale' ? `<div class="small" style="margin-top:12px;background:#fffbeb;padding:12px">${NS.pub ? (s().iban ? `Ödemenizi <b>${esc(s().bankHolder || s().bizName)}</b> adına <b class="mono">${esc(s().iban)}</b> IBAN'ına yapın.` : `Havale bilgileri için bizi arayın: ${esc(s().bizPhone || '')}.`) : 'Havale bilgileri için işletmeyle iletişime geçin.'} Açıklamaya sipariş numaranızı (${esc(no)}) yazınız.</div>` : ''}</div>` : ''}
      <div class="row" style="justify-content:center;margin-top:20px"><a class="bt ol" href="#/takip/${esc(no)}">Siparişimi takip et</a><a class="bt" href="#/">Alışverişe devam et</a></div></div></div>`;
  }
  let trackPhone = '';
  function track(el, no) {
    // Bulutta sipariş, numara + telefonun son 4 hanesiyle görüntülenir (siparişi veren tarayıcı otomatik görür)
    const mine = db.pub && db.pubIdent && db.get('orders', db.pubIdent.i);
    if (no && db.pub && !(mine && mine.no === no.toUpperCase().trim()) && trackPhone) db.lookup({ no, last4: trackPhone }); else db.load();
    const o = no && db.find('orders', (x) => x.no === no.toUpperCase().trim());
    const flow = [['yeni', 'Sipariş alındı', 'check'], ['hazirlaniyor', 'Hazırlanıyor', 'box'], ['kargoda', 'Kargoda', 'truck'], ['teslim', 'Teslim edildi', 'home']];
    const idx = o ? flow.findIndex((f) => f[0] === o.status) : -1;
    el.innerHTML = `<div class="w" style="max-width:760px;padding-bottom:60px"><div class="crumb"><a href="#/">Ana sayfa</a> / Sipariş takibi</div><h1 class="serif" style="font-size:44px">Sipariş takibi</h1><p class="muted mt">Sipariş numaranızı (ör. LB10450) girerek durumunu görebilir, iade talebi oluşturabilirsiniz.</p><div class="row nw" style="margin:22px 0;gap:8px"><input class="input" id="tn" style="height:52px" placeholder="Sipariş numarası" value="${esc(no || '')}">${NS.pub ? `<input class="input" id="tl" style="height:52px;max-width:170px" inputmode="numeric" maxlength="4" placeholder="Tel. son 4 hane" value="${esc(trackPhone)}">` : ''}<button class="bt" id="tg">Sorgula</button></div>
      ${no && !o ? `<div class="box center">${NS.pub && !trackPhone ? 'Sipariş numaranız ve telefonunuzun son 4 hanesiyle sorgulayın.' : 'Sipariş bulunamadı. Bilgileri kontrol edin.'}</div>` : ''}${o ? `<div class="box"><div class="row between mb"><b>${esc(o.no)} · ${NS.date(o.at)}</b>${NS.badge(SH.ST[o.status][0], SH.ST[o.status][1])}</div>
        ${['iptal', 'iade'].includes(o.status) ? '' : `<div style="display:grid;grid-template-columns:repeat(4,1fr);margin:24px 0">${flow.map(([k, l, ic], i) => `<div style="text-align:center;position:relative"><div style="width:40px;height:40px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:${i <= idx ? '#141414' : 'var(--surface-2)'};color:${i <= idx ? '#fff' : 'var(--text-3)'};position:relative;z-index:1">${icon(ic)}</div>${i ? `<i style="position:absolute;top:20px;right:50%;width:100%;height:2px;background:${i <= idx ? '#141414' : 'var(--border)'}"></i>` : ''}<div class="small" style="margin-top:8px;font-weight:${i === idx ? 700 : 500}">${l}</div></div>`).join('')}</div>`}
        ${o.tracking ? `<div class="small" style="background:var(--surface-2);padding:12px">${icon('truck')} ${esc(o.carrier)} · Takip no <b class="mono">${esc(o.tracking)}</b></div>` : ''}
        ${o.items.map((i) => { const p = db.get('products', i.pid) || { id: i.pid, colors: [] }; return `<div class="ci" style="grid-template-columns:60px 1fr auto;padding:10px 0">${imgTag(p, 0, 150)}<div class="small"><b>${esc(i.name)}</b><div class="muted">${esc(i.variant)} · ${i.qty} adet</div></div><b class="small">${money(i.price * i.qty)}</b></div>`; }).join('')}<div class="row between" style="margin-top:10px"><b>Toplam</b><b>${money(o.total)}</b></div>
        ${o.status === 'teslim' && !db.find('returns', (r) => r.order === o.id) ? `<button class="bt ol mt" id="rr" style="margin-top:16px">İade talebi oluştur</button>` : ''}${db.find('returns', (r) => r.order === o.id) ? `<div class="mt">${NS.badge('İade talebiniz alındı', 'info')}</div>` : ''}</div>` : ''}</div>`;
    const go = () => { if ($('#tl', el)) trackPhone = $('#tl', el).value.replace(/\D/g, '').slice(-4); const h = '#/takip/' + encodeURIComponent($('#tn', el).value.trim()); if (location.hash === h) track(el, $('#tn', el).value.trim()); else location.hash = h; };
    $('#tg', el).onclick = go; $('#tn', el).onkeydown = (e) => { if (e.key === 'Enter') go(); };
    if ($('#rr', el)) $('#rr', el).onclick = async () => { const v = await NS.formModal({ title: 'İade talebi', fields: [{ name: 'reason', label: 'İade nedeni', type: 'select', options: ['Beden uymadı', 'Ürün beklentimi karşılamadı', 'Kusurlu / hasarlı ürün', 'Yanlış ürün gönderildi', 'Diğer'] }, { name: 'note', label: 'Açıklama', type: 'textarea', full: true }], submitLabel: 'Talep oluştur' }); if (v) { db.insert('returns', { order: o.id, reason: v.reason + (v.note ? ' — ' + v.note : ''), at: new Date().toISOString(), status: 'bekliyor' }); toast('İade talebiniz alındı. Mağaza sizinle iletişime geçecek.', 'ok'); track(el, no); } };
  }
  const PAGES = { iade: ['İade ve değişim', 'Ürünlerinizi teslim aldıktan sonra 14 gün içinde, kullanılmamış ve etiketi koparılmamış olması koşuluyla ücretsiz iade edebilir ya da değiştirebilirsiniz. Sipariş takibi sayfasından talep oluşturun; iade gönderimi için mağaza sizinle iletişime geçer. İade tutarı ürün depomuza ulaştıktan sonra 3 iş günü içinde ödeme yaptığınız karta yansıtılır.'], kargo: ['Kargo ve teslimat', 'Saat 15:00’e kadar verilen siparişler aynı gün kargoya verilir. Teslimat süresi 1-3 iş günüdür. 750 ₺ ve üzeri siparişlerde kargo ücretsizdir; altındaki siparişlerde kargo bedeli 79 ₺’dir. Kapıda ödeme seçeneği için 30 ₺ hizmet bedeli alınır.'], beden: ['Beden rehberi', 'Ölçü tablosu her ürün sayfasındaki “Beden rehberi” bağlantısında yer alır. İki beden arasında kaldıysanız büyük bedeni öneririz.'], sss: ['Sıkça sorulan sorular', 'Siparişimi nasıl takip ederim? — Sipariş takibi sayfasından sipariş numaranızla. · Kapıda ödeme var mı? — Evet, nakit veya kartla. · Fatura nasıl gelir? — e-Arşiv faturanız e-posta adresinize gönderilir. · Taksit var mı? — Tüm kredi kartlarına 3 taksit.'], hakkimizda: ['Hakkımızda', 'Zamansız, kaliteli ve sürdürülebilir parçaları ulaşılabilir fiyatlarla sunmak için yola çıktık. Koleksiyonlarımız İstanbul’daki atölyemizde tasarlanıyor.'], kvkk: ['KVKK ve gizlilik', 'Kişisel verileriniz 6698 sayılı KVKK kapsamında yalnızca siparişinizin işlenmesi, teslimat ve yasal yükümlülükler için işlenir; açık rızanız olmadan üçüncü kişilerle paylaşılmaz.'], sozlesme: ['Mesafeli satış sözleşmesi', 'Bu sözleşme, alıcının satıcıya ait internet sitesinden elektronik ortamda siparişini verdiği ürünlerin satışı ve teslimine ilişkin olarak 6502 sayılı Tüketicinin Korunması Hakkında Kanun ve Mesafeli Sözleşmeler Yönetmeliği hükümleri gereğince tarafların hak ve yükümlülüklerini düzenler. (Örnek metindir; hukukçunuza onaylatın.)'], 'on-bilgilendirme': ['Ön bilgilendirme formu', 'Satıcı bilgileri, ürünün temel nitelikleri, vergiler dahil toplam fiyat, ödeme ve teslimat bilgileri ile cayma hakkı koşulları sipariş özetinde ve bu formda yer alır. (Örnek metindir.)'] };
  function infoPage(el, k) { const [t, b] = PAGES[k] || ['Sayfa bulunamadı', '']; el.innerHTML = `<div class="w" style="max-width:780px;padding-bottom:70px"><div class="crumb"><a href="#/">Ana sayfa</a> / ${esc(t)}</div><h1 class="serif" style="font-size:44px">${esc(t)}</h1><p style="margin-top:20px;line-height:1.8;color:var(--text-2)">${esc(b)}</p></div>`; }

  function route() {
    const [, r = '', p] = location.hash.match(/^#\/?([^/]*)\/?(.*)$/) || [];
    const old = $('#pg'); const el = old.cloneNode(false); old.replaceWith(el);
    const arg = p ? decodeURIComponent(p) : '';
    document.title = `${s().bizName} — Kadın giyim, çanta ve ayakkabı`;
    $$('nav.mn [data-n]').forEach((a) => a.classList.toggle('on', a.dataset.n === (r === 'kategori' ? arg : r)));
    closeAll();
    ({ '': home, kategori: (e) => listPage(e, 'kategori', arg), ara: (e) => listPage(e, 'ara', arg), yeni: (e) => listPage(e, 'yeni'), favoriler: (e) => listPage(e, 'favoriler'), urun: (e) => productPage(e, arg), odeme: checkout, tesekkurler: (e) => thanks(e, arg), takip: (e) => track(e, arg), sayfa: (e) => infoPage(e, arg) }[r] || home)(el);
    window.scrollTo(0, 0);
  }
  frame();
  on(document.body, 'click', '[data-fav]', (e, b) => { e.preventDefault(); e.stopPropagation(); toggleFav(b.dataset.fav); });
  on(document.body, 'click', '[data-qa]', (e, b) => { e.preventDefault(); const [id, z] = b.dataset.qa.split('|'); const p = db.get('products', id); addToCart(p, z, null, 1); });
  on(document.body, 'click', '[data-close]', () => closeAll());
  window.addEventListener('hashchange', route);
  window.addEventListener('storage', (e) => { if (e.key === db.key) db.load(); });
  route();
})();
</script>
</body>
</html>
