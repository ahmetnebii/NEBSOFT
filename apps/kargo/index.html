<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT Kargo & Kurye</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
  .tl .it { position: relative; padding-bottom: 12px; }
  .tl .it::before { content: ''; position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
  .price-box { border-radius: 16px; padding: 18px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #000)); color: #fff; }
  .price-box .v { font-size: 36px; font-weight: 800; }
  .stop { border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; background: var(--surface); }
  .stop .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
  canvas.sig { width: 100%; height: 150px; border: 2px dashed var(--border); border-radius: 12px; background: #fff; touch-action: none; }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/integrations.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
