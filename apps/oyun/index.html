<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT Oyun Salonu</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .pano { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .ist { border: 2px solid var(--border); border-radius: 14px; background: var(--surface); padding: 12px; min-height: 122px; cursor: pointer; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 4px; }
  .ist:hover { border-color: var(--accent); }
  .ist.dolu { border-color: var(--accent); background: var(--accent-soft); }
  .ist.mola { border-color: var(--warn); background: var(--warn-soft); }
  .ist.bitti { border-color: var(--err); background: var(--err-soft); }
  .ist.ariza { opacity: .6; border-style: dashed; cursor: not-allowed; }
  .ist b { font-size: 14px; }
  .ist .sure { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kalem { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .menu-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
  .menu-g button { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 8px; font: 600 12px var(--font); color: var(--text); cursor: pointer; text-align: left; }
  .menu-g button:disabled { opacity: .5; cursor: not-allowed; }
  .menu-g small { display: block; color: var(--text-3); font-weight: 500; }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/integrations.js"></script>
<script src="hesap.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
