<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBSOFT CRM</title>
<link rel="stylesheet" href="../../core/core.css">
<style>
  .pipe { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; align-items: start; padding-bottom: 8px; }
  .stage { background: var(--bg-2); border-radius: 14px; padding: 10px; min-height: 65vh; }
  .stage.over { outline: 2px dashed var(--accent); }
  .stage h4 { margin: 2px 4px 4px; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .stage .sum { margin: 0 4px 10px; font-size: 12px; color: var(--text-2); }
  .deal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: grab; box-shadow: var(--shadow); }
  .deal b { display: block; font-size: 13px; }
  .deal .v { font-weight: 800; margin-top: 4px; }
  .deal.stale { border-left: 3px solid var(--warn); }
  .act { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .act .ai { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
</style>
</head>
<body>
<script src="../../core/core.js"></script>
<script src="../../core/integrations.js"></script>
<script src="quote.js"></script>
<script src="app.js"></script>
</body>
</html>
